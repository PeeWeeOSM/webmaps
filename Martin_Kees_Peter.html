<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#1c1c1e;color:#eee;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#hdr{padding:9px 14px;background:#111;display:flex;align-items:center;flex-shrink:0}
#hdr h1{font-size:15px;font-weight:600}
#map-wrap{flex:1;position:relative;overflow:hidden}
#map{position:absolute;top:0;left:0;width:100%;height:100%}
/* Controls overlay: always on top */
#controls-overlay{position:absolute;top:10px;left:10px;z-index:1000;display:flex;flex-direction:column;gap:4px;pointer-events:none}
#controls-overlay>*{pointer-events:auto}
/* Hide Leaflet default zoom controls, we use our own */
.leaflet-control-zoom{display:none!important}
#notice{display:none;position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#ffc;padding:7px 16px;border-radius:20px;font-size:12px;pointer-events:none;z-index:1001}
.ctrl-btn{width:34px;height:34px;background:white;border:2px solid rgba(0,0,0,0.25);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.ctrl-btn:hover{background:#f4f4f4}
.ctrl-btn.on{background:#d4efff;border-color:#2980b9}
.ctrl-btn.zoom{font-size:22px;font-weight:300}
.zoom-sep{height:1px;background:#ccc;margin:0 4px}
.zoom-group{background:white;border:2px solid rgba(0,0,0,0.25);border-radius:4px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.zoom-group .ctrl-btn{border:none;border-radius:0;box-shadow:none;width:34px;height:32px}
.zoom-group .ctrl-btn:first-child{border-bottom:1px solid #ddd}
#layers-overlay{display:none;position:absolute;top:96px;right:10px;z-index:1200}
/* The panel sits ~138px below the top of #map-wrap (overlay top:96px + panel
   top:42px), and #map-wrap itself starts below the ~40px header. So relative to
   the viewport the panel top is ~178px. Cap its height to the space left down to
   ~16px above the bottom edge: 178 + 16 = ~194, rounded to 200px of slack. This
   keeps the last row ("Base map"/OpenStreetMap) and its opacity slider on-screen
   and internally scrollable even with many extra layers. dvh (with a vh fallback)
   uses the *visible* height so it stays correct when the mobile address bar shows;
   the earlier 154px value ignored the header, pushing the bottom slider off-screen
   and out of scroll reach on the phone. */
#layers-panel{display:none;position:absolute;top:0;right:40px;background:white;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:10px 12px;min-width:180px;max-width:240px;max-height:calc(100vh - 200px);max-height:calc(100dvh - 200px);overflow-y:auto;-webkit-overflow-scrolling:touch}
#layers-panel.open{display:block}
#layers-panel h3{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.layer-toggle-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;color:#222}
#zoom-indicator{position:absolute;top:52px;right:10px;z-index:1000;background:white;border:2px solid rgba(0,0,0,0.25);border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.3);padding:6px 10px;font-size:13px;font-weight:600;color:#222;pointer-events:none}
.layer-toggle-row input{flex-shrink:0}
.layer-toggle-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer-opacity-row{display:flex;align-items:center;gap:6px;padding:2px 0 6px 22px;border-bottom:1px solid #eee}
.layer-opacity-row:last-child{border-bottom:none;padding-bottom:2px}
.layer-opacity-row input[type=range]{flex:1;height:4px;accent-color:#185FA5;cursor:pointer}
.layer-opacity-row span{font-size:11px;color:#999;min-width:30px;text-align:right}
.layer-section-label{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.04em;padding:4px 0 2px}
/* User route loader panel */
#info-btn{position:absolute;top:10px;right:10px;z-index:1000;width:30px;height:30px;border-radius:50%;background:white;border:2px solid rgba(0,0,0,.25);box-shadow:0 2px 8px rgba(0,0,0,.3);font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:16px;color:#2980b9;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#info-btn:hover{background:#f4f4f4}
#route-overlay{position:absolute;top:138px;right:10px;z-index:1200}
#route-btn svg{width:20px;height:20px;display:block}
#route-btn:hover{background:#f4f4f4}
#search-overlay{position:relative}
#search-panel{position:fixed;top:8px;left:52px;width:300px;max-width:calc(100vw - 100px);background:#fff;border:2px solid rgba(0,0,0,0.25);border-radius:8px;padding:8px;box-shadow:0 2px 12px rgba(0,0,0,0.35);z-index:2000}
#search-panel.results-collapsed #search-results,#search-panel.results-collapsed #search-status{display:none}
#search-collapse svg{display:block;transition:transform .15s}
#search-collapse.flip svg{transform:rotate(180deg)}
#search-panel.hidden{display:none}
#search-btn svg{display:block}
.search-row{display:flex;gap:5px;align-items:center}
#search-input{flex:1;min-width:0;padding:6px 8px;border:1px solid #bbb;border-radius:5px;font-size:16px}
#search-go{flex:none;width:32px;height:32px;border:1px solid #2e7d32;border-radius:5px;background:#2e7d32;color:#fff;cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.search-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.search-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.03em}
#search-collapse,#search-close{flex:none;width:26px;height:26px;border:1px solid #bbb;border-radius:5px;background:#f4f4f4;cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;color:#333}
#search-close:hover{background:#fde7ef;border-color:#d81b60;color:#d81b60}
#search-results{margin-top:6px;max-height:240px;overflow-y:auto}
.search-result{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:5px;cursor:pointer;border-bottom:1px solid #eee}
.search-result:last-child{border-bottom:none}
.search-result:hover,.search-result.sr-hover{background:#fde7ef}

/* Width is fluid: caps at 380px on wide screens (laptop, unchanged) but shrinks
   to the viewport width minus a 20px margin on narrow phones, so the panel never
   runs off either edge. Without this the fixed 320px min-width pushed the leftmost
   geometry icon and the rightmost close (x) button off-screen on small phones.
   box-sizing:border-box (set globally) means the 16px padding is included, so the
   panel footprint always leaves ~10px clear on each side. dvh height keeps it
   within the visible area even when the mobile address bar is shown. */
#route-panel{display:none;position:fixed;right:8px;bottom:0;top:auto;background:white;border-radius:10px 10px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.3);padding:10px 12px;width:min(380px,calc(100vw - 16px));max-height:62vh;max-height:62dvh;z-index:2200;flex-direction:column}

.user-route-row .route-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;color:#222}

.user-route-row .route-more{background:none;border:none;font-size:18px;cursor:pointer;flex-shrink:0;padding:0 4px;line-height:1;color:#555}

/* Keep Leaflet attribution including the Ukraine flag — shown as thanks to the maker */

<body>
<div id="hdr"><h1>Martin_Kees_Peter</h1></div>
<div id="map-wrap">
  <div id="map"></div>
  <div id="controls-overlay">
    <div class="zoom-group">
      <button class="ctrl-btn zoom" onclick="zoomBtn(1)" title="Zoom in">+</button>

    <button class="ctrl-btn" id="fullscreen-btn" title="Full screen" style="display:none"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5"/><path d="M20 9V4h-5"/><path d="M15 20h5v-5"/><path d="M4 15v5h5"/></svg></button>
    <div id="search-overlay">
      <button class="ctrl-btn" id="search-btn" title="Search"><svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg></button>
      <div id="search-panel" class="hidden">
        <div class="search-head">
          <span class="search-title">Search visible area</span>
          <button id="search-collapse" title="Hide results"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/><path d="M6 19l6-6 6 6"/></svg></button>
          <button id="search-close" title="End search (remove markers)">&times;</button>
        </div>
        <div class="search-row">
          <input type="text" id="search-input" placeholder="Place, caf&eacute;, bench, water&hellip;" autocomplete="off" list="search-hist"><datalist id="search-hist"></datalist>
          <button id="search-go" title="Search">&#8594;</button>

    <div id="vis-overlay">

  if(mode==='nametag') return (elementName&&elementName.trim()&&!isDateTimeOnly(elementName)) ? elementName.trim() : f.filename;
  return f.filename;
}

function buildWaypointMarker(f, w){
  if(f.wptIconSvg){
    const sz=f.wptIconSize||28;
    return L.marker([w.lat,w.lon],{
      icon:L.divIcon({
        className:'',
        html:'<div style="width:'+sz+'px;height:'+sz+'px;display:flex;align-items:center;justify-content:center;color:'+f.color+';filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))">'+f.wptIconSvg+'</div>',
        iconSize:[sz,sz],
        iconAnchor:[sz/2,sz/2]
      })
    });
  }
  return L.circleMarker([w.lat,w.lon],{radius:f.lineWidth||8,color:f.color,fillColor:f.color,fillOpacity:.9,weight:1});
}

function midpt(coords){return coords[Math.floor(coords.length/2)];}

// --- Status in URL: extent en laag-zichtbaarheid kunnen via #-hash gedeeld worden ---
// --- URL hash state: map position and layer visibility are stored in the #hash
//     so the user can bookmark or share the exact current map view ---
function parseStateFromHash(){
  if(!location.hash || location.hash.length<2) return null;
  const params=new URLSearchParams(location.hash.slice(1));
  const lat=parseFloat(params.get('lat'));
  const lng=parseFloat(params.get('lng'));
  const z=parseInt(params.get('z'));
  const layersParam=params.get('layers');
  const markerParam=params.get('marker');
  const out={};
  if(!isNaN(lat)&&!isNaN(lng)&&!isNaN(z)){ out.lat=lat; out.lng=lng; out.z=z; }
  if(layersParam!=null){ out.layerVis=layersParam.split(',').map(v=>v==='1'); }
  if(markerParam!=null){
    const parts=markerParam.split(',').map(parseFloat);
    if(parts.length===2 && !isNaN(parts[0]) && !isNaN(parts[1])) out.marker=[parts[0],parts[1]];
  }
  return Object.keys(out).length?out:null;
}

function updateUrlHash(){
  const c=map.getCenter();
  const params=new URLSearchParams();
  params.set('lat',c.lat.toFixed(6));
  params.set('lng',c.lng.toFixed(6));
  params.set('z',map.getZoom());
  if(wmsLayerObjs.length){
    params.set('layers',wmsLayerObjs.map(lo=>map.hasLayer(lo.layer)?'1':'0').join(','));
  }
  history.replaceState(null,'','#'+params.toString());
}

// Automatically figures out how far a tile layer's real tiles actually go: the
// first time a tile genuinely fails to load at a plausibly-high zoom level (not
// just a low-zoom network blip), the layer's native ceiling is capped there and
// redrawn, so zoom levels beyond it optically over-zoom (blur) instead of
// showing blank/broken tiles.
function attachAutoNativeZoom(layer){
  let capped=false;
  layer.on('tileerror',function(err){
    if(capped) return;
    const z=err && err.coords && err.coords.z;
    if(z==null || z<14) return;
    capped=true;
    layer.options.maxNativeZoom=z-1;
    layer.redraw();
  });
}

    attachAutoNativeZoom(lyr);
    // default on/off priority: an explicit "layers=" in the URL (a shared link) wins,

    const defaultOn=(urlState&&urlState.layerVis&&urlState.layerVis[i]!=null)?urlState.layerVis[i]:(SAVED_LAYER_STATE&&SAVED_LAYER_STATE[i]!=null)?!!SAVED_LAYER_STATE[i]:(el.defaultOn===true);

// --- OSM Notes overlay: live query of the OSM Notes API for the current view ------
// Anonymous GET (no key, CORS-friendly). Only fetches from a configured zoom level so
// the number of notes stays reasonable, and debounces on map move. Each marker shows
// the note's opening text and a link to the note on openstreetmap.org.
(function(){
  if(typeof NOTES_CONFIG==='undefined' || !NOTES_CONFIG || !NOTES_CONFIG.enabled) return;
  var cfg=NOTES_CONFIG;
  var minZoom=cfg.minZoom||12;
  var colorOpen=cfg.colorOpen||'#e8590c';
  var icon=(cfg.icon!=null&&cfg.icon!=='')?cfg.icon:'!';
  var notesGroup=L.layerGroup();
  var notesOn=false, seq=0, debTimer=null;
  function nEsc(s){ return String(s==null?'':s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;'); }
  function noteIcon(color){
    return L.divIcon({className:'osm-note-icon', html:'<div style="width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:'+color+';border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center"><span style="transform:rotate(45deg);color:#fff;font-size:13px;line-height:1;font-weight:700">'+nEsc(icon)+'</span></div>', iconSize:[26,26], iconAnchor:[13,25], popupAnchor:[0,-24]});
  }
  function render(features){
    notesGroup.clearLayers();
    (features||[]).forEach(function(f){
      try{
        var g=f.geometry, p=f.properties||{};
        if(!g||!g.coordinates) return;
        var lon=g.coordinates[0], lat=g.coordinates[1];
        if(p.status==='closed') return;   // open notes only
        var comments=p.comments||[];
        var first=comments.length?(comments[0].text||''):'';
        var txt=nEsc(first);
        if(txt.length>400) txt=txt.slice(0,400)+'…';
        var html='<div style="max-width:240px;font-size:13px"><b>OSM note</b><br>'+(txt||'<i>(no text)</i>')+'<br><a href="https://www.openstreetmap.org/note/'+encodeURIComponent(p.id)+'" target="_blank" rel="noopener">Open on OSM</a></div>';
        var m=L.marker([lat,lon],{icon:noteIcon(colorOpen)});
        m.bindPopup(html);
        notesGroup.addLayer(m);
      }catch(e){}
    });
  }
  function fetchNotes(){
    if(!notesOn) return;
    var z, b;
    try{ z=map.getZoom(); b=map.getBounds(); }catch(e){ return; }   // map not positioned yet
    if(z<minZoom){ notesGroup.clearLayers(); return; }
    var bbox=b.getWest().toFixed(5)+','+b.getSouth().toFixed(5)+','+b.getEast().toFixed(5)+','+b.getNorth().toFixed(5);
    var url='https://api.openstreetmap.org/api/0.6/notes.json?bbox='+bbox+'&limit=100&closed=0';
    var mySeq=++seq;
    fetch(url).then(function(r){ return r.json(); }).then(function(js){
      if(mySeq!==seq || !notesOn) return;
      render(js&&js.features);
    }).catch(function(){});
  }
  function schedule(){ if(!notesOn) return; clearTimeout(debTimer); debTimer=setTimeout(fetchNotes, 600); }
  map.on('moveend zoomend', schedule);
  var panelContent=document.getElementById('layers-panel-content');
  if(panelContent){
    var sec=document.createElement('div'); sec.className='layer-section-label'; sec.style.marginTop='6px'; sec.textContent='OSM Notes'; panelContent.appendChild(sec);
    var row=document.createElement('label'); row.className='layer-toggle-row';
    row.innerHTML='<input type="checkbox" '+(cfg.defaultOn?'checked':'')+'><span>Show OSM notes</span>';
    panelContent.appendChild(row);
    var hint=document.createElement('div'); hint.style.cssText='font-size:11px;color:#666;margin:-2px 0 4px'; hint.textContent='Live from OSM · zoom '+minZoom+'+'; panelContent.appendChild(hint);
    row.querySelector('input').addEventListener('change',function(e){
      notesOn=e.target.checked;
      if(notesOn){ map.addLayer(notesGroup); fetchNotes(); }
      else { map.removeLayer(notesGroup); notesGroup.clearLayers(); }
    });
  }
  if(cfg.defaultOn){ notesOn=true; map.addLayer(notesGroup); map.whenReady(fetchNotes); }
})();

// --- OpenStreetMap element links: turn an @id like "way/123" into a link icon ---
function osmUrlFrom(id){
  if(!id) return '';
  var s=(''+id).trim(), parts=s.split('/');
  if(parts.length!==2) return '';
  var t=parts[0], n=parts[1];
  if(t!=='node' && t!=='way' && t!=='relation') return '';
  if(!n.length) return '';
  for(var k=0;k<n.length;k++){ var ch=n.charCodeAt(k); if(ch<48||ch>57) return ''; }
  return 'https://www.openstreetmap.org/'+t+'/'+n;
}
function osmLink(id){
  var u=osmUrlFrom(id);
  return u?' <a href="'+u+'" target="_blank" rel="noopener" title="View on OpenStreetMap" style="text-decoration:none">&#128279;</a>':'';
}
function elPopup(name, desc, id){
  var lk=osmLink(id), html='';
  if(name){ html='<b>'+name+'</b>'+lk; }
  else if(lk){ html=lk.slice(1); }
  if(desc){ html+=(html?'<br>':'')+desc; }
  return html;
}
// Baked-track gradient colouring: draw Creator-exported grade tracks by slope.
var BGRADE_STOPS=[-12,-6,-2,2,6,12];
var BGRADE_COLORS=['#7b3294','#4292c6','#41ab5d','#9e9e9e','#f16913','#cb181d','#000000'];
var BGRADE_LABELS=['< -12%','-12..-6%','-6..-2%','flat (-2..2%)','2..6%','6..12%','> 12%'];
function bGradeClass(pct){ for(var i=0;i<BGRADE_STOPS.length;i++){ if(pct<BGRADE_STOPS[i]) return i; } return BGRADE_STOPS.length; }
function bTrackHasEle(t){ return t && t.ele && t.ele.length===t.coords.length && t.ele.some(function(x){ return x!=null && !isNaN(x); }); }

function bBuildGradeRuns(coords, ele){
  var n=coords.length; if(n<2) return [];
  var cfg=(typeof GRADE_CONFIG!=='undefined'&&GRADE_CONFIG)?GRADE_CONFIG:{};
  var baseline=Math.max(20, cfg.baseline||90);
  var minSeg=Math.max(0, cfg.minSeg!=null?cfg.minSeg:60);
  var HYST=0.5;
  var d=[0]; for(var i=1;i<n;i++){ d[i]=d[i-1]+haversineMeters(coords[i-1],coords[i]); }
  var half=baseline/2, grade=new Array(n);
  for(i=0;i<n;i++){
    var a=i, b=i;
    while(a>0 && d[i]-d[a]<half) a--;
    while(b<n-1 && d[b]-d[i]<half) b++;
    var ea=ele[a], eb=ele[b], dd=d[b]-d[a];
    grade[i]=(ea!=null && eb!=null && !isNaN(ea) && !isNaN(eb) && dd>0)?((eb-ea)/dd*100):0;
  }
  var cls=new Array(n), cur=bGradeClass(grade[0]); cls[0]=cur;
  for(i=1;i<n;i++){
    var lo=(cur>0)?BGRADE_STOPS[cur-1]:-Infinity, hi=(cur<BGRADE_STOPS.length)?BGRADE_STOPS[cur]:Infinity;
    if(grade[i]>=hi+HYST || grade[i]<lo-HYST) cur=bGradeClass(grade[i]);
    cls[i]=cur;
  }
  var pRuns=[], sIdx=0;
  for(i=1;i<n;i++){ if(cls[i]!==cls[sIdx]){ pRuns.push({s:sIdx,e:i,c:cls[sIdx]}); sIdx=i; } }
  pRuns.push({s:sIdx,e:n-1,c:cls[sIdx]});
  function runLen(r){ return d[r.e]-d[r.s]; }
  var changed=true, guard=0;
  while(changed && guard++<200 && pRuns.length>1){
    changed=false;
    for(var k=0;k<pRuns.length && pRuns.length>1;k++){
      if(runLen(pRuns[k])>=minSeg) continue;
      var prev=k>0?pRuns[k-1]:null, next=k<pRuns.length-1?pRuns[k+1]:null;
      var into=(prev&&next)?((runLen(prev)>=runLen(next))?prev:next):(prev||next);
      if(!into) continue;
      if(into===prev) prev.e=pRuns[k].e; else next.s=pRuns[k].s;
      pRuns.splice(k,1); changed=true; break;
    }
  }
  var runs=[];
  pRuns.forEach(function(r){
    var last=runs.length?runs[runs.length-1]:null;
    if(last && last._c===r.c){ last.coords=coords.slice(last._s, r.e+1); last._e=r.e; }
    else runs.push({coords:coords.slice(r.s, r.e+1), color:BGRADE_COLORS[r.c], _c:r.c, _s:r.s, _e:r.e});
  });
  return runs;
}

function destPoint(lat,lng,distanceM,brngDeg){
  const R=6371000, brng=brngDeg*Math.PI/180, la1=lat*Math.PI/180, lo1=lng*Math.PI/180;
  const la2=Math.asin(Math.sin(la1)*Math.cos(distanceM/R)+Math.cos(la1)*Math.sin(distanceM/R)*Math.cos(brng));
  const lo2=lo1+Math.atan2(Math.sin(brng)*Math.sin(distanceM/R)*Math.cos(la1),Math.cos(distanceM/R)-Math.sin(la1)*Math.sin(la2));
  return [la2*180/Math.PI, lo2*180/Math.PI];
}

// ---- GPX export: writes a real file to the device, so a route survives closing
// the browser (localStorage can be wiped by the browser; a file cannot). ----
function pwXmlEsc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pwStamp(){ var d=new Date(), p=function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes()); }
function pwSafeName(s){ var n=String(s||'route').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,''); return n||'route'; }
function pwDownloadText(text,filename){
  try{
    var blob=new Blob([text],{type:'application/gpx+xml'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
    return true;
  }catch(e){ return false; }
}
function pwBuildGpx(name, segments, waypoints){
  var NL=String.fromCharCode(10);
  var out='<?xml version="1.0" encoding="UTF-8"?>'+NL;
  out+='<gpx version="1.1" creator="PeeWeeTrails" xmlns="http://www.topografix.com/GPX/1/1">'+NL;
  out+='  <metadata><name>'+pwXmlEsc(name)+'</name><time>'+new Date().toISOString()+'</time></metadata>'+NL;
  (waypoints||[]).forEach(function(w){
    var lat=(w.lat!=null)?w.lat:w[0];
    var lng=(w.lng!=null)?w.lng:((w.lon!=null)?w.lon:w[1]);
    if(lat==null||lng==null) return;
    out+='  <wpt lat="'+(+lat).toFixed(6)+'" lon="'+(+lng).toFixed(6)+'">';
    if(w.name) out+='<name>'+pwXmlEsc(w.name)+'</name>';
    if(w.desc) out+='<desc>'+pwXmlEsc(w.desc)+'</desc>';
    out+='</wpt>'+NL;
  });
  var segs=(segments||[]).map(function(sg){
    if(sg && sg.coords) return {coords:sg.coords, ele:sg.ele||null};   // {coords, ele}
    return {coords:sg, ele:null};                                       // plain array (back-compat)
  }).filter(function(sg){ return sg.coords && sg.coords.length>1; });
  if(segs.length){
    out+='  <trk><name>'+pwXmlEsc(name)+'</name>'+NL;
    segs.forEach(function(seg){
      out+='    <trkseg>'+NL;
      seg.coords.forEach(function(c,ci){
        var lat=(c.lat!=null)?c.lat:c[0];
        var lng=(c.lng!=null)?c.lng:c[1];
        if(lat==null||lng==null) return;
        out+='      <trkpt lat="'+(+lat).toFixed(6)+'" lon="'+(+lng).toFixed(6)+'">';
        var ev=(seg.ele&&seg.ele[ci]!=null)?seg.ele[ci]:((c[3]!=null&&!isNaN(c[3]))?c[3]:null);
        if(ev!=null) out+='<ele>'+(+ev).toFixed(1)+'</ele>';
        if(c[2]) out+='<time>'+new Date(c[2]).toISOString()+'</time>';
        out+='</trkpt>'+NL;
      });
      out+='    </trkseg>'+NL;
    });
    out+='  </trk>'+NL;
  }
  out+='</gpx>'+NL;
  return out;
}
// Recorded GPS trail: each stretch between two gaps (screen off) becomes its own
// <trkseg>, so the gaps stay visible in the file instead of turning into a long line.
function saveTrailGpx(){
  if(!locHistory || locHistory.length<2){ showToast('No recorded trail yet.'); return; }
  var seg=splitTrail(locHistory);
  var segs=seg.solid.map(function(s){
    return { coords:s, ele:s.map(function(pt){ var a=locAltByTime[pt[2]]; return (a!=null)?a:null; }) };
  });
  var name='PeeWeeTrails_trail_'+pwStamp();
  if(pwDownloadText(pwBuildGpx(name, segs, []), name+'.gpx')) showToast('Saved as '+name+'.gpx', 4000);
  else showToast('Could not save the file.');
}

// Warn before leaving when a full-route recording of real length (> 1 km) would
// otherwise be lost. Browsers only permit a generic "Leave site?" confirmation
// here (no custom text), so this simply gives the visitor a chance to stay.
// Note: mobile browsers largely ignore beforeunload, so this mainly helps on desktop.
window.addEventListener('beforeunload', function(e){
  try{
    if(TRAIL_MODE!=='full' || !locHistory || locHistory.length<2) return;
    var d=0; for(var i=1;i<locHistory.length;i++) d+=haversineMeters(locHistory[i-1],locHistory[i]);
    if(d>1000){ e.preventDefault(); e.returnValue=''; return ''; }
  }catch(err){}
});

// Direction arrows (km markers and route arrows) are drawn at a geographic bearing,
// but markers themselves do not rotate with the map. Correct their on-screen angle
// by the map bearing so they keep pointing along the route when the map is turned.
function updateArrowRotations(){
  const b=map.getBearing();
  const els=document.querySelectorAll('svg[data-deg]');
  for(let i=0;i<els.length;i++){
    const d=parseFloat(els[i].getAttribute('data-deg'))||0;

function updateCompass(){ const inner=locBtn.querySelector('.compass-inner'); if(!inner) return; compassAngle+=angleDeltaDeg(compassAngle, map.getBearing()); inner.style.transform='rotate('+compassAngle+'deg)'; }
map.on('rotate move zoom', updateCompass);

// +/- zoom: while actively following, zoom around the user's own on-map position
// (25% from the bottom in movement mode, centre in north mode) instead of the map
// centre, so the user's location stays put. The new zoom sticks (RECENTER_ZOOM) so
// the next GPS fix re-anchors at this level rather than snapping back.
function zoomBtn(delta){
  var cur=map.getZoom();
  var nz=Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), cur+delta));
  if(nz===cur) return;
  if(following && locMode!=='off' && lastKnownLatLng){
    // Zoom around your location, but treat it as a temporary manual change: it
    // lasts until the next auto-center ("Center map"), which returns to the
    // "Zoom level" setting. The setting stays authoritative.
    programmaticMove=true;
    map.once('zoomend', function(){ programmaticMove=false; });
    map.setZoomAround(lastKnownLatLng, nz);
    following=false; lastUserInteraction=Date.now();
  } else {
    map.setZoom(nz);
  }
}

function haversineMeters(p1,p2){
  const R=6371000;
  const lat1=p1[0]*Math.PI/180, lat2=p2[0]*Math.PI/180;
  const dLat=(p2[0]-p1[0])*Math.PI/180, dLon=(p2[1]-p1[1])*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// Trim the trail: with 'full' everything is kept (whole ride, even after 50km), with 'distance'
// only the points within the last TRAIL_METERS meters (measured along the path) are kept.
// Keep the GPS trail (and its accompanying circle/marker) rendered above
// everything else, including tracks imported later via "Import files".
function bringTrailToFront(){
  // Only path-based layers (polylines/polygons) implement bringToFront().
  // L.Marker (e.g. dirMarker, lc) does not, so guard each call to avoid a
  // crash that would otherwise abort whatever triggered this (e.g. adding a
  // BRouter/imported route to the list).
  if(locTrailBg && locTrailBg.bringToFront) locTrailBg.bringToFront();
  if(locTrail && locTrail.bringToFront) locTrail.bringToFront();
  if(gapTrail && gapTrail.bringToFront) gapTrail.bringToFront();
  if(lc && lc.bringToFront) lc.bringToFront();
  if(dirMarker && dirMarker.bringToFront) dirMarker.bringToFront();
}

function trimTrail(history){
  if(TRAIL_MODE==='full' || history.length<2) return history;
  let acc=0;
  let cutIdx=0;
  for(let i=history.length-1;i>0;i--){
    acc+=haversineMeters(history[i-1],history[i]);
    if(acc>=TRAIL_METERS){ cutIdx=i-1; break; }
    cutIdx=0;
  }
  return history.slice(cutIdx);
}

// When the phone screen switches off, no coordinates are recorded; the next fix
// (screen back on) is far away in time. Draw those stretches as a thin dotted
// line so it is clear that no recording happened there.
const GAP_MS=15000; // > 15s between two consecutive fixes = a recording gap
function splitTrail(hist){
  var solid=[], gaps=[], cur=[];
  for(var i=0;i<hist.length;i++){
    cur.push(hist[i]);
    if(i<hist.length-1){
      var t0=hist[i][2], t1=hist[i+1][2];
      if(t0!=null && t1!=null && (t1-t0)>GAP_MS){ solid.push(cur); cur=[]; gaps.push([hist[i],hist[i+1]]); }
    }
  }
  if(cur.length) solid.push(cur);
  return {solid:solid, gaps:gaps};
}
function gapStyle(){ return {color:TRAIL_COLOR,weight:Math.min(4,Math.max(2,Math.round(TRAIL_WIDTH*0.5))),opacity:0.9,lineCap:'round',dashArray:'1,14'}; }
function redrawTrail(){
  if(!locTrail) return;
  var seg=splitTrail(locHistory);
  locTrail.setLatLngs(seg.solid);
  locTrailBg.setLatLngs(seg.solid);
  if(gapTrail) gapTrail.setLatLngs(seg.gaps);
}

// --- Trail settings panel: lets the visitor adjust the recorded trail's
// color, width, and length (full route vs. only the last N meters) live ---
{
  const trailBtn=document.getElementById('trail-settings-btn');
  const trailPanel=document.getElementById('trail-panel');
  const colorInput=document.getElementById('trail-color-input');
  const widthInput=document.getElementById('trail-width-input');
  const centerInput=document.getElementById('trail-center-input');

  // --- Persist the visitor's Settings choices per map (localStorage) ---
  // A saved choice overrides the Creator's baked-in default; with nothing saved,
  // the baked default stays in effect. Keyed per page so different maps are
  // independent. Gesture rotation is handled separately below.
  function psKey(n){ return 'PeeWeeTrails_set_'+n+'__'+location.pathname; }
  function psGet(n){ try{ return localStorage.getItem(psKey(n)); }catch(e){ return null; } }
  function psSet(n,v){ try{ localStorage.setItem(psKey(n), String(v)); }catch(e){} }
  (function(){
    var v;
    v=psGet('color');  if(v!=null) TRAIL_COLOR=v;
    v=psGet('width');  if(v!=null) TRAIL_WIDTH=parseInt(v)||TRAIL_WIDTH;
    v=psGet('zoom');   if(v!=null) RECENTER_ZOOM=parseInt(v)||RECENTER_ZOOM;
    v=psGet('follow'); if(v!=null){ var f=parseInt(v); if(!isNaN(f)) FOLLOW_DELAY=f; }
    v=psGet('hide');   if(v!=null){ var h=parseInt(v); if(!isNaN(h)) HIDE_UI_DELAY=h; }
  })();

  colorInput.value=TRAIL_COLOR;
  widthInput.value=TRAIL_WIDTH;
  const zoomInput=document.getElementById('trail-zoom-input');
  zoomInput.value=RECENTER_ZOOM;
  zoomInput.addEventListener('change',function(){ RECENTER_ZOOM=Math.max(1,Math.min(22,parseInt(zoomInput.value)||17)); zoomInput.value=RECENTER_ZOOM; psSet('zoom',RECENTER_ZOOM); });

  // Two-finger gesture rotation. Off by default: it's almost always triggered by
  // accident during a pinch-zoom, and the compass modes rotate the map on their
  // own anyway. Disabling touchRotate only switches off the rotate part of the
  // pinch gesture (zoom keeps working), and shiftKeyRotate covers desktop
  // shift+wheel. Programmatic map.setBearing() (used by the compass modes) is
  // unaffected. The choice is remembered per map.
  function applyGestureRotate(on){
    try{
      if(on){ if(map.touchRotate) map.touchRotate.enable(); if(map.shiftKeyRotate) map.shiftKeyRotate.enable(); }
      else { if(map.touchRotate) map.touchRotate.disable(); if(map.shiftKeyRotate) map.shiftKeyRotate.disable(); }
    }catch(e){}
  }

// --- Full-screen toggle ---
// On Android Chromium (Brave/Chrome) this gives a true immersive view with no
// address bar and no system bars. Feature-detected, so the button stays hidden
// where the Fullscreen API isn't available (e.g. iOS Safari, which only allows
// fullscreen on <video>). Exit with the button, the Android back gesture, or a
// swipe from the top edge.
(function(){
  const btn=document.getElementById('fullscreen-btn');
  if(!btn) return;
  const root=document.documentElement;
  const reqFs=root.requestFullscreen||root.webkitRequestFullscreen;
  const exitFs=document.exitFullscreen||document.webkitExitFullscreen;
  if(!reqFs){ btn.style.display='none'; return; }
  btn.style.display='';
  const ICON_OPEN='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5"/><path d="M20 9V4h-5"/><path d="M15 20h5v-5"/><path d="M4 15v5h5"/></svg>';
  const ICON_CLOSE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h5V4"/><path d="M20 9h-5V4"/><path d="M15 20v-5h5"/><path d="M9 20v-5H4"/></svg>';
  function isFull(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
  function sync(){
    const f=isFull();
    btn.innerHTML=f?ICON_CLOSE:ICON_OPEN;
    btn.title=f?'Exit full screen':'Full screen';
    btn.classList.toggle('on', f);
  }
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    try{ if(isFull()){ if(exitFs) exitFs.call(document); } else { reqFs.call(root); } }catch(err){}
  });
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  sync();
})();

// --- Web app manifest (injected at runtime) ---
// Built here rather than as a static file so start_url matches the real page
// URL wherever the map is hosted. Lets "Add to home screen" launch the map
// full-screen / app-like on Android. Reuses the page's own SVG icon. Harmless
// where unsupported.
(function(){
  try{
    const iconEl=document.querySelector('link[rel="icon"]');
    const iconHref=iconEl?iconEl.href:'';
    const manifest={
      name:document.title||'PeeWeeTrails map',

    };
    const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});

    link.rel='manifest';

function bearing(p1,p2){
  // peiling in graden van p1 naar p2 (0=noord)
  const lat1=p1[0]*Math.PI/180, lat2=p2[0]*Math.PI/180;
  const dLon=(p2[1]-p1[1])*Math.PI/180;
  const y=Math.sin(dLon)*Math.cos(lat2);
  const x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

// Pointed triangle as SVG: rotation center exactly at the center of the shape, no skewed rendering
function makeDirIcon(deg){
  return L.divIcon({
    className:'',
    html:'<svg width="46" height="46" viewBox="0 0 46 46" style="transform:rotate('+deg+'deg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))">'
        +'<polygon points="23,2 31,39 23,29 15,39" fill="'+TRAIL_COLOR+'" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>'
        +'</svg>',
    iconSize:[46,46],
    iconAnchor:[23,23]
  });
}

// --- Screen Wake Lock ---
// Keep the display awake while navigating so a phone on the handlebars doesn't
// dim or sleep mid-ride. Silently no-ops where the API is missing. The browser
// auto-releases the lock when the tab is hidden, so we re-acquire it on
// visibilitychange whenever location tracking is still on.
async function requestWakeLock(){
  try{
    if(!('wakeLock' in navigator)) return;
    if(wakeLock) return;
    wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',function(){ wakeLock=null; });
  }catch(e){ wakeLock=null; }
}
function releaseWakeLock(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){ wakeLock=null; }
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible' && locMode!=='off'){
    requestWakeLock();
    // The browser freezes timers and often pauses GPS while the page is hidden,
    // which can leave the map in an odd state on return (stale position, a frozen
    // follow timer, a burst of catch-up events). Reset the idle baseline and, if we
    // were following, re-center cleanly so we resume from a known-good position.
    lastUserInteraction=Date.now();
    if(following && lastKnownLatLng){ try{ orient(); }catch(e){} }
  }
});

function stopLoc(){
  // Stop GPS watching but KEEP the trail on the map and locHistory intact
  // so the trail survives toggling the location button off and on again.
  // History is only cleared when the page/tab is closed.
  if(wid!==null){navigator.geolocation.clearWatch(wid);wid=null;}
  if(followCheckInterval!==null){clearInterval(followCheckInterval);followCheckInterval=null;}
  smoothedHeading=null;
  // Remove only the accuracy circle and direction arrow, not the trail line
  if(lc){map.removeLayer(lc);lc=null;}
  if(dirMarker){map.removeLayer(dirMarker);dirMarker=null;}
  followZoom=null;
  releaseWakeLock();
}

// Detect manual map interaction (drag/zoom by user) to temporarily pause auto-centering
map.on('dragstart zoomstart rotate',function(){
  if(!programmaticMove){ lastUserInteraction=Date.now(); following=false; sharedView=false; }
});

function recenterOnLocation(ll){
  if(followZoom===null) followZoom=Math.max(map.getZoom(),16);
  programmaticMove=true;
  map.setView(ll, followZoom, {animate:false});
  programmaticMove=false;
}
function orient(){
  if(locMode==='off'){ if(following) setBearingProg(0); return; }
  if(!following || !lastKnownLatLng) return;
  const zoom=RECENTER_ZOOM;
  if(locMode==='north'){
    setBearingProg(0);
    programmaticMove=true; map.setView(lastKnownLatLng, zoom, {animate:false}); programmaticMove=false;
  } else if(locMode==='movement'){
    if(isMoving && smoothedHeading!=null){
      northHold=false;   // moving again: leave north-hold and resume heading-up framing
      const hdg=smoothedHeading;
      const H=map.getContainer().clientHeight;
      const dest=destPoint(lastKnownLatLng[0], lastKnownLatLng[1], H*0.25*metersPerPixel(lastKnownLatLng[0], zoom), hdg);
      setBearingProg(-hdg);
      programmaticMove=true; map.setView(dest, zoom, {animate:false}); programmaticMove=false;
    } else if(northHold){
      // Double-tapped the arrow while stopped: show north-up AND centre the user,
      // exactly like "north up" mode, and hold it there until movement resumes.
      setBearingProg(0);
      programmaticMove=true; map.setView(lastKnownLatLng, zoom, {animate:false}); programmaticMove=false;
    } else {
      // Just stopped moving (no double-tap): keep the current orientation and the
      // below-centre framing, like when moving. Only "north up" mode / a double-tap
      // centres the user. So don't rotate, but still offset ahead in the current facing.
      const hdgCur=-map.getBearing();
      const H=map.getContainer().clientHeight;
      const dest=destPoint(lastKnownLatLng[0], lastKnownLatLng[1], H*0.25*metersPerPixel(lastKnownLatLng[0], zoom), hdgCur);
      programmaticMove=true; map.setView(dest, zoom, {animate:false}); programmaticMove=false;
    }
  }
}

function startGPS(){
  if(wid!==null) return;
  if(!navigator.geolocation){alert('GPS is not available in this browser.');return;}

  wid=navigator.geolocation.watchPosition(function(p){
    var _alt=p.coords.altitude;
    const ll=[p.coords.latitude,p.coords.longitude,Date.now()];
    if(_alt!=null && !isNaN(_alt)) locAltByTime[ll[2]]=_alt;
    lastKnownLatLng=ll;
    locHistory.push(ll);
    locHistory=trimTrail(locHistory);

    // determine bearing: use GPS heading if available, otherwise compute from trail
    let deg=0;
    if(p.coords.heading!=null && !isNaN(p.coords.heading)){
      deg=p.coords.heading;
    } else if(locHistory.length>=2){
      deg=bearing(locHistory[0],locHistory[locHistory.length-1]);
    }
    if(locMode==='movement'){
      // Only treat this as "moving" (and let the map rotate to a heading) when there
      // is real motion — from GPS speed, or otherwise from how far we moved since the
      // last fix. Standing still keeps the current orientation (so a double-tap to
      // north stays north until you actually move again).
      var movingNow;
      if(p.coords.speed!=null && !isNaN(p.coords.speed)) movingNow = p.coords.speed>0.7;
      else if(locHistory.length>=2) movingNow = haversineMeters(locHistory[locHistory.length-2], ll) > 3;
      else movingNow = false;
      var wasMoving=isMoving;
      isMoving = movingNow;
      // If you start moving again during a held-north view (e.g. after panning to
      // orient yourself), start the auto-return countdown from now — so the map
      // returns to movement direction FOLLOW_DELAY after you start moving.
      if(movingNow && !wasMoving && northHold){ lastUserInteraction=Date.now(); }
      if(movingNow){
        if(p.coords.heading!=null && !isNaN(p.coords.heading)){
          if(smoothedHeading==null) smoothedHeading=deg;
          else { const dd=angleDeltaDeg(smoothedHeading,deg); smoothedHeading+=dd*(Math.abs(dd)>20?0.6:0.25); }
        } else if(smoothedHeading==null && locHistory.length>=2){
          smoothedHeading=deg;
        }
      }
    } else { isMoving=false; }
    lastGeoHeading=deg;

    if(locTrail){
      redrawTrail();
      if(lc) lc.setLatLng(ll).setRadius(p.coords.accuracy);
      else lc=L.circle(ll,{radius:p.coords.accuracy,color:TRAIL_COLOR,fillColor:TRAIL_COLOR,fillOpacity:.12,weight:1}).addTo(map);
      if(dirMarker) dirMarker.setLatLng(ll).setIcon(makeDirIcon(deg + map.getBearing()));
      else dirMarker=L.marker(ll,{icon:makeDirIcon(deg + map.getBearing()),interactive:false,zIndexOffset:500}).addTo(map).bindPopup('Your location');
    } else {
      lc=L.circle(ll,{radius:p.coords.accuracy,color:TRAIL_COLOR,fillColor:TRAIL_COLOR,fillOpacity:.12,weight:1}).addTo(map);
      // White base line first, then a dashed colored line on top — gives a true
      // two-tone (e.g. purple/white) dashed look regardless of the map underneath,
      // and reads more clearly against imported tracks of a similar solid color.
      locTrailBg=L.polyline(locHistory,{color:'#fff',weight:TRAIL_WIDTH,opacity:.9,lineCap:'round'}).addTo(map);
      locTrail=L.polyline(locHistory,{color:TRAIL_COLOR,weight:TRAIL_WIDTH,opacity:1,lineCap:'butt',dashArray:(TRAIL_WIDTH*1.6)+','+(TRAIL_WIDTH*1.3)}).addTo(map);
      gapTrail=L.polyline(splitTrail(locHistory).gaps,gapStyle()).addTo(map);
      dirMarker=L.marker(ll,{icon:makeDirIcon(deg + map.getBearing()),interactive:false,zIndexOffset:500}).addTo(map).bindPopup('Your location');
    }
    bringTrailToFront();

    if(!dirMarker._shown){ dirMarker._shown=true; if(followZoom===null) followZoom=Math.max(map.getZoom(),16); lastUserInteraction=Date.now(); }
    if(following) orient();
    if(dirMarker) dirMarker.setIcon(makeDirIcon(deg + map.getBearing()));
  },function(e){
    // GPS errors come in two flavours:
    //  - PERMISSION_DENIED (code 1): a real, permanent stop. The user has to
    //    grant permission, so turn location off cleanly and tell them once.
    //  - TIMEOUT (3) / POSITION_UNAVAILABLE (2): usually transient (a tunnel,
    //    tree cover, a slow first fix). Keep the watch alive so a later fix
    //    recovers on its own; show a discreet, throttled hint instead of
    //    killing navigation with a blocking alert mid-ride.
    if(e && e.code===1){
      stopLoc();
      locBtn.classList.remove('tracking');
      locMode='off'; following=false; setBearingProg(0);
      document.querySelectorAll('#compass-menu .cm-item').forEach(function(el){ el.classList.toggle('active', el.dataset.mode==='off'); });
      showToast('Location permission denied — enable it in your browser settings.',4000);
    } else {
      var now=Date.now();
      if(now-lastGpsHintAt>8000){ lastGpsHintAt=now; showToast('Weak GPS signal — trying to reconnect…',2500); }
    }
  },{enableHighAccuracy:true,maximumAge:1000});
}

// --- Visibility panel: toggle and opacity control per geometry type ---
// Each geometry type (tracks, waypoints, polygons) can be shown/hidden
// and faded independently via the eye-button dropdown (left controls).
{
  const visBtn=document.getElementById('vis-btn');
  const visPanel=document.getElementById('vis-panel');

  // Open/close the panel when clicking the eye button
  visBtn.onclick=function(e){e.stopPropagation(); if(!visPanel.classList.contains('open')) closePanelsExcept('vis-panel'); visPanel.classList.toggle('open');};
  document.addEventListener('click',function(e){
    const overlay=document.getElementById('vis-overlay');
    if(!overlay.contains(e.target))visPanel.classList.remove('open');
  });

  // State per geometry type — strictly separate, zero overlap between arrays:
  // tracks = lines + start dots + km markers (trackLineLayers + trackDotLayers)
  // waypoints = waypoint markers only (wptMarkerLayers)
  // polygons = polygon areas only (polygonLayers)
  const trackAllLayers=[...trackLineLayers,...trackDotLayers];
  const state={
    tracks:   {visible:true, opacity:1, layers:trackAllLayers,  eye:'vis-eye-tracks',   op:'vis-op-tracks',   pct:'vis-pct-tracks'},
    waypoints:{visible:true, opacity:1, layers:wptMarkerLayers, eye:'vis-eye-waypoints',op:'vis-op-waypoints', pct:'vis-pct-waypoints'},
    polygons: {visible:true, opacity:1, layers:polygonLayers,   eye:'vis-eye-polygons', op:'vis-op-polygons',  pct:'vis-pct-polygons'}
  };

  // Helper: apply opacity to any layer type without side-effects (no radius change for circles)
  function applyOpacity(l,op){
    if(!l.setStyle&&!l.setOpacity&&!l.getElement) return;
    if(l.setStyle){
      if(l instanceof L.CircleMarker && !(l instanceof L.Circle)){
        l.setStyle({opacity:op, fillOpacity:op});
      } else if(l instanceof L.Polygon){
        l.setStyle({opacity:op, fillOpacity:op*(l._baseFillOpacity!=null?l._baseFillOpacity:0.22)});
      } else {
        l.setStyle({opacity:op});
      }
    } else if(l.setOpacity){
      l.setOpacity(op);
    }
    // Also fade the DOM element (catches DivIcon markers like start/km markers)
    const el=l.getElement&&l.getElement();
    if(el)el.style.opacity=op;
  }

  Object.entries(state).forEach(([type,s])=>{
    const eyeBtn=document.getElementById(s.eye);
    const opSlider=document.getElementById(s.op);
    const pctEl=document.getElementById(s.pct);

    eyeBtn.addEventListener('click',function(){
      s.visible=!s.visible;
      eyeBtn.style.opacity=s.visible?'1':'0.35';

      // Set _userHidden on every layer in this group and add/remove from map
      s.layers.forEach(l=>{
        l._userHidden=!s.visible;
        if(s.visible){ if(!map.hasLayer(l)) map.addLayer(l); }
        else { if(map.hasLayer(l)) map.removeLayer(l); }
      });

      // Track toggle: show/hide track labels (NOT waypoint labels)
      if(type==='tracks'){
        labelLayers.forEach(l=>{
          if(l._wptLabel||l._polLabel) return;
          l._userHidden=!s.visible;
          if(l.setText){
            if(!s.visible) l.setText(null);
          } else {
            if(s.visible){ if(!map.hasLayer(l)) map.addLayer(l); }
            else { if(map.hasLayer(l)) map.removeLayer(l); }
          }
        });
      }
      // Polygons toggle: show/hide polygon labels
      if(type==='polygons'){
        labelLayers.forEach(l=>{
          if(!l._polLabel) return;
          l._userHidden=!s.visible;
          if(s.visible){ if(!map.hasLayer(l)) map.addLayer(l); }
          else { if(map.hasLayer(l)) map.removeLayer(l); }
        });
      }

      // Waypoints toggle: show/hide waypoint labels
      if(type==='waypoints'){
        labelLayers.forEach(l=>{
          if(!l._wptLabel) return;
          l._userHidden=!s.visible;
          if(s.visible){ if(!map.hasLayer(l)) map.addLayer(l); }
          else { if(map.hasLayer(l)) map.removeLayer(l); }
        });
      }

      // Re-run zoom logic so layers respect zoom range when being shown again
      if(s.visible) updateLabels();
    });

    opSlider.addEventListener('input',function(){
      const op=parseInt(opSlider.value)/100;
      s.opacity=op;
      pctEl.textContent=opSlider.value+'%';
      s.layers.forEach(l=>applyOpacity(l,op));
      // Track opacity also fades track labels (not waypoint labels)
      if(type==='tracks') labelLayers.forEach(l=>{if(!l._wptLabel&&!l._polLabel)applyOpacity(l,op);});
      if(type==='waypoints') labelLayers.forEach(l=>{if(l._wptLabel)applyOpacity(l,op);});
      if(type==='polygons') labelLayers.forEach(l=>{if(l._polLabel)applyOpacity(l,op);});
    });
  });

  // Hide polygon row if there are no polygons in the baked-in data
  const hasPolygons=D.some(f=>(f.polygons||[]).length>0);
  if(!hasPolygons) document.getElementById('vis-row-polygons').style.display='none';
  const hasWaypoints=D.some(f=>f.waypoints.length>0);
  if(!hasWaypoints) document.getElementById('vis-row-waypoints').style.display='none';
  const hasTracks=D.some(f=>f.tracks.length>0);
  if(!hasTracks) document.getElementById('vis-row-tracks').style.display='none';
  // Hide the entire vis-overlay if there is no baked-in data at all
  if(!hasTracks&&!hasWaypoints&&!hasPolygons){
    document.getElementById('vis-overlay').style.display='none';
  }
}

  // (value/5 - 500) metres, timestamp as seconds since the FIT epoch
  // (1989-12-31). Only "record" messages (global #20) are decoded; any other
  // message is skipped by its size, so we do not need the full FIT profile.

  function parseUserGeoJSON(text){

        const desc=(props&&(props.desc||props.description||props.Description))||'';
        const osmId=(props&&(props['@id']||props.osm_id||props.id))||'';

  // ---- Elevation helpers (shared by the route detail panel and the route builder) ----
  function elHav(a,b){
    var R=6371000,la1=a[0]*Math.PI/180,la2=b[0]*Math.PI/180;
    var dLa=(b[0]-a[0])*Math.PI/180,dLo=(b[1]-a[1])*Math.PI/180;

  // Total ascent/descent with a small hysteresis filter (TH metres) to suppress

  function elevStats(coords, ele){

    for(i=0;i<ele.length;i++){
      e=ele[i]; if(e==null||isNaN(e)) continue;

      if(ref===null){ ref=e; continue; }

      if(d>TH){ asc+=d; ref=e; } else if(d<-TH){ desc+=-d; ref=e; }
    }
    if(!have) return null;
    var dist=0; for(i=0;i+1<coords.length;i++) dist+=elHav(coords[i],coords[i+1]);
    return {ascent:Math.round(asc),descent:Math.round(desc),min:Math.round(mn),max:Math.round(mx),dist:dist};
  }
  // Concatenate the elevation-bearing tracks of a route into one {coords,ele} pair,
  // or null when the route carries no usable elevation.
  function routeEleData(r){

    ((r&&r.parsed&&r.parsed.tracks)||[]).forEach(function(t){
      if(!t.coords) return;

      for(var k=0;k<t.coords.length;k++){ coords.push(t.coords[k]); var e=(te&&te[k]!=null)?te[k]:null; ele.push(e); if(e!=null)any=true; }

  }
  // Build a small inline SVG elevation profile (distance on X, height on Y).
  function buildElevSvg(coords, ele){

    var total=d[d.length-1]||1, mn=Infinity,mx=-Infinity,e;
    for(i=0;i<ele.length;i++){ e=ele[i]; if(e==null||isNaN(e))continue; if(e<mn)mn=e; if(e>mx)mx=e; }

  function buildArrowDecorator(coords, color){
    // Arrows at 1km, 4km, 7km, 10km... (first at 1km then every 3km)
    // Clicking shows only the km distance — no route name
    const arrows=[];
    let dist=0, nextArrow=1000;
    function hvDist(a,b){
      const R=6371000,lat1=a[0]*Math.PI/180,lat2=b[0]*Math.PI/180;
      const dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180;
      const x=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
      return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
    }
    function brng(a,b){
      const lat1=a[0]*Math.PI/180,lat2=b[0]*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180;
      return(Math.atan2(Math.sin(dLon)*Math.cos(lat2),Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon))*180/Math.PI+360)%360;
    }
    for(let i=0;i<coords.length-1;i++){
      const seg=hvDist(coords[i],coords[i+1]);
      while(dist+seg>=nextArrow){
        const t=(nextArrow-dist)/seg;
        const lat=coords[i][0]+t*(coords[i+1][0]-coords[i][0]);
        const lon=coords[i][1]+t*(coords[i+1][1]-coords[i][1]);
        const deg=brng(coords[i],coords[i+1]);
        const kmLabel=Math.round(nextArrow/1000)+' km';
        const svg='<svg width="18" height="18" viewBox="0 0 18 18" data-deg="'+deg+'" style="transform:rotate('+(deg+map.getBearing())+'deg)"><polygon points="9,1 14,16 9,11 4,16" fill="'+color+'" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>';
        const marker=L.marker([lat,lon],{
          icon:L.divIcon({className:'',html:svg,iconSize:[18,18],iconAnchor:[9,9]}),
          interactive:true, zIndexOffset:100
        });
        marker.bindPopup(kmLabel);
        arrows.push(marker);
        nextArrow+=1000;  // every 1km
      }
      dist+=seg;
    }
    return arrows;
  }


  // Helper: render polygon as Leaflet layer — MultiPolygon via L.geoJSON, plain via L.polygon
  function addUserRoute(name, parsed, color, lineWidth, preset){
    const lyrGroup=[];
    const allCoords=[];

    // Calculate total track length for km suffix
    function trackKm(coords){
      let d=0;
      for(let i=1;i<coords.length;i++){
        const R=6371000,lat1=coords[i-1][0]*Math.PI/180,lat2=coords[i][0]*Math.PI/180;
        const dLat=(coords[i][0]-coords[i-1][0])*Math.PI/180,dLon=(coords[i][1]-coords[i-1][1])*Math.PI/180;
        const a=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
        d+=R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

    // Compute km suffix: only when file has exactly 1 track and no waypoints/polygons

    const displayName=preset?preset.name:((kmSuffix?kmSuffix.trim()+' ':'')+name);

    });

      if(w.name||w.desc)m.bindPopup('<b>'+(w.name||name)+'</b>'+(w.desc?'<br>'+w.desc:''));

    for(var _bi=0;_bi<allCoords.length;_bi++){ var _p=allCoords[_bi]; if(_p[0]<_mLa)_mLa=_p[0]; if(_p[0]>_xLa)_xLa=_p[0]; if(_p[1]<_mLo)_mLo=_p[1]; if(_p[1]>_xLo)_xLo=_p[1]; }

    const hasTrk=parsed.tracks.length>0;

    const routeDefaults=hasTrk
      ? {lineWidth:5,showArrows:true,showLabel:true,labelMode:'nametag',useElementName:true,labelPos:'start',showStart:true,showKmMarkers:true,showTrackDist:true,labelZoomMin:14,labelZoomMax:22,labelFontSize:24,mapZoomMin:1,mapZoomMax:22}
      : hasWpt
      ? {lineWidth:8,showArrows:false,showLabel:true,labelMode:'nametag',useElementName:true,labelPos:'centroid',showStart:false,showKmMarkers:false,showTrackDist:false,labelZoomMin:15,labelZoomMax:22,labelFontSize:24,mapZoomMin:1,mapZoomMax:22}
      : {lineWidth:2,showArrows:false,showLabel:true,labelMode:'nametag',useElementName:true,labelPos:'centroid',showStart:false,showKmMarkers:false,showTrackDist:false,labelZoomMin:15,labelZoomMax:22,labelFontSize:24,mapZoomMin:1,mapZoomMax:22};

  function zoomInRange(r){
    const zmin=r.labelZoomMin!=null?r.labelZoomMin:1;
    const zmax=r.labelZoomMax!=null?r.labelZoomMax:22;

    return z>=zmin&&z<=zmax;
  }

  function elemZoomInRange(r){
    const zmin=r.mapZoomMin!=null?r.mapZoomMin:1;
    const zmax=r.mapZoomMax!=null?r.mapZoomMax:22;
    const z=map.getZoom();
    return z>=zmin&&z<=zmax;
  }

  function updateUserRouteLabelVisibility(){

      if(!r.labelLayer)return;
      const show=r.visible&&r.showLabel!==false&&zoomInRange(r);
      if(show){ if(!map.hasLayer(r.labelLayer)) r.labelLayer.addTo(map); }
      else { if(map.hasLayer(r.labelLayer)) map.removeLayer(r.labelLayer); }
      if(r.startLayer){
        const showStart=r.visible&&zoomInRange(r);
        if(showStart){ if(!map.hasLayer(r.startLayer)) r.startLayer.addTo(map); }
        else { if(map.hasLayer(r.startLayer)) map.removeLayer(r.startLayer); }

    });
  }
  map.on('zoomend', updateUserRouteLabelVisibility);

  function updateUserRouteElemVisibility(){

      const show=r.visible&&elemZoomInRange(r);
      (r.layers||[]).forEach(l=>{

        else { if(map.hasLayer(l)) map.removeLayer(l); }

      if(l._isGrade){ l.setStyle({weight:(r.lineWidth||5),opacity:r.opacity}); return; }

  function setRouteOpacity(idx,op){
    const r=userRoutes[idx];
    r.opacity=op;
    r.layers.forEach(l=>{
      if(!l.setStyle) return;
      if(l instanceof L.CircleMarker&&!(l instanceof L.Circle)){
        l.setStyle({opacity:op,fillOpacity:op});
      } else if(l instanceof L.Polygon){
        l.setStyle({opacity:op,fillOpacity:op*(r.fillOpacity!=null?r.fillOpacity:0.2)});
      } else {
        l.setStyle({opacity:op});
      }
    });
    r.arrowLayers.forEach(a=>{const el=a.getElement&&a.getElement();if(el)el.style.opacity=op;});
    // labelLayer can be a single Marker or a LayerGroup (for waypoints)
    if(r.labelLayer){
      if(r.labelLayer.eachLayer){
        r.labelLayer.eachLayer(l=>{const el=l.getElement&&l.getElement();if(el)el.style.opacity=op;});
      } else {
        const el=r.labelLayer.getElement&&r.labelLayer.getElement();if(el)el.style.opacity=op;
      }
    }
    if(r.startLayer){const el=r.startLayer.getElement&&r.startLayer.getElement();if(el)el.style.opacity=op;}
  }

    if(userRoutes[idx].labelLayer){if(vis)map.addLayer(userRoutes[idx].labelLayer);else map.removeLayer(userRoutes[idx].labelLayer);}

  // --- Persistence: remember imported routes across a browser reload / tab discard ---

  function removeUserRoute(idx){
    userRoutes[idx].layers.forEach(l=>map.removeLayer(l));

    if(userRoutes[idx].labelLayer)map.removeLayer(userRoutes[idx].labelLayer);
    if(userRoutes[idx].startLayer)map.removeLayer(userRoutes[idx].startLayer);

  function clearAllUserRoutes(){
    if(userRoutes.length===0) return;

      r.layers.forEach(l=>map.removeLayer(l));

  // ---- Gradient (slope) colouring for tracks with elevation --------------------
  // Absolute grade classes, symmetric, matching the BRouter-web / Heightgraph scheme:
  // flat -3..3%, then 3/6/9/12/15% up and down, capped at +/-15%. Colours diverge:
  // downhill blue/green, flat grey, uphill yellow -> orange -> red -> dark red.
  var GRADE_STOPS=[-12,-6,-2,2,6,12];
  var GRADE_COLORS=['#7b3294','#4292c6','#41ab5d','#9e9e9e','#f16913','#cb181d','#000000'];

        labelMode:r.labelMode||'nametag',
        showStart:!!r.showStart,

        labelZoomMax:(r.labelZoomMax!=null?r.labelZoomMax:22),
        labelFontSize:24,

  // Split a track into runs of constant grade class; returns [{coords, color}].
  function buildGradeRuns(coords, ele){
    var n=coords.length; if(n<2) return [];
    var cfg=(typeof GRADE_CONFIG!=='undefined'&&GRADE_CONFIG)?GRADE_CONFIG:{};
    var baseline=Math.max(20, cfg.baseline||90);   // distance the gradient is measured over
    var minSeg=Math.max(0, cfg.minSeg!=null?cfg.minSeg:60); // absorb runs shorter than this
    var HYST=0.5;                                   // % margin at class boundaries (anti-flicker)
    var d=[0]; for(var i=1;i<n;i++){ d[i]=d[i-1]+haversineMeters(coords[i-1],coords[i]); }
    // Gradient at each point measured over a centered window of ~baseline metres. Because
    // the source data (SRTM) is ~90 m resolution, a long baseline is what removes the
    // interpolation noise that otherwise creates spurious short up/down slivers.
    var half=baseline/2, grade=new Array(n);
    for(i=0;i<n;i++){
      var a=i, b=i;
      while(a>0 && d[i]-d[a]<half) a--;
      while(b<n-1 && d[b]-d[i]<half) b++;
      var ea=ele[a], eb=ele[b], dd=d[b]-d[a];
      grade[i]=(ea!=null && eb!=null && !isNaN(ea) && !isNaN(eb) && dd>0)?((eb-ea)/dd*100):0;
    }
    // Classify with hysteresis: only leave the current class once the gradient passes the
    // boundary by HYST, so it doesn't flip back and forth right on a threshold.
    var cls=new Array(n), cur=gradeClassIndex(grade[0]); cls[0]=cur;
    for(i=1;i<n;i++){
      var lo=(cur>0)?GRADE_STOPS[cur-1]:-Infinity;
      var hi=(cur<GRADE_STOPS.length)?GRADE_STOPS[cur]:Infinity;
      if(grade[i]>=hi+HYST || grade[i]<lo-HYST) cur=gradeClassIndex(grade[i]);
      cls[i]=cur;
    }
    // Build point-runs of constant class.
    var pRuns=[], sIdx=0;
    for(i=1;i<n;i++){ if(cls[i]!==cls[sIdx]){ pRuns.push({s:sIdx,e:i,c:cls[sIdx]}); sIdx=i; } }
    pRuns.push({s:sIdx,e:n-1,c:cls[sIdx]});
    // Merge runs shorter than minSeg into their longer neighbour (absorbs slivers).
    function runLen(r){ return d[r.e]-d[r.s]; }
    var changed=true, guard=0;
    while(changed && guard++<200 && pRuns.length>1){
      changed=false;
      for(var k=0;k<pRuns.length && pRuns.length>1;k++){
        if(runLen(pRuns[k])>=minSeg) continue;
        var prev=k>0?pRuns[k-1]:null, next=k<pRuns.length-1?pRuns[k+1]:null;
        var into=(prev&&next)?((runLen(prev)>=runLen(next))?prev:next):(prev||next);
        if(!into) continue;
        if(into===prev) prev.e=pRuns[k].e; else next.s=pRuns[k].s;
        pRuns.splice(k,1); changed=true; break;
      }
    }
    // Join neighbouring runs that ended up in the same class, then emit polylines.
    var runs=[];
    pRuns.forEach(function(r){
      var last=runs.length?runs[runs.length-1]:null;
      if(last && last._c===r.c){ last.coords=coords.slice(last._s, r.e+1); last._e=r.e; }
      else runs.push({coords:coords.slice(r.s, r.e+1), color:GRADE_COLORS[r.c], _c:r.c, _s:r.s, _e:r.e});
    });
    return runs;
  }
  // Rebuild a route's line layers according to its colorMode ('fixed' or 'grade').
  function rebuildRouteLines(idx){
    var r=userRoutes[idx]; if(!r) return;
    r.layers=(r.layers||[]).filter(function(l){ if(l._isLine){ map.removeLayer(l); return false; } return true; });
    var grade=(r.colorMode==='grade');
    (r.parsed.tracks||[]).forEach(function(t){
      if(grade && trackHasEle(t)){
        var casing=L.polyline(t.coords,{color:'#ffffff',weight:(r.lineWidth||5)+4,opacity:r.opacity,lineCap:'round',lineJoin:'round'});
        casing._isLine=true; casing._isCasing=true;
        if(r.visible!==false) casing.addTo(map);
        r.layers.push(casing);
        buildGradeRuns(t.coords,t.ele).forEach(function(run){
          var seg=L.polyline(run.coords,{color:run.color,weight:(r.lineWidth||5),opacity:r.opacity,lineCap:'round',lineJoin:'round'});
          seg._isLine=true; seg._isGrade=true;
          if(r.visible!==false) seg.addTo(map);
          r.layers.push(seg);
        });
      } else {
        var poly=L.polyline(t.coords,{color:r.color,weight:(r.lineWidth||5),opacity:r.opacity});
        poly.bindPopup('<b>'+(t.name||r.name)+'</b>');
        poly._isLine=true;
        if(r.visible!==false) poly.addTo(map);
        r.layers.push(poly);
      }
    });
  }

  function loadFile(file, accept){
    if(!file)return;
    const nameLow=file.name.toLowerCase();
    const isGpx=nameLow.endsWith('.gpx');
    const isGj=nameLow.endsWith('.geojson')||nameLow.endsWith('.json');
    const isFit=nameLow.endsWith('.fit');
    if(!isGpx&&!isGj&&!isFit){alert('Please choose a .gpx, .geojson or .fit file.');return;}
    if(accept==='gpx'&&!isGpx){alert('Please choose a .gpx file.');return;}
    if(accept==='geojson'&&!isGj){alert('Please choose a .geojson or .json file.');return;}
    const reader=new FileReader();
    reader.onload=ev=>{
      let parsed;
      try{
        parsed = isFit ? parseUserFit(ev.target.result)
               : isGpx ? parseUserGPX(ev.target.result)
               : parseUserGeoJSON(ev.target.result);
      }catch(err){
        alert('Could not read this file'+(isFit?' as a FIT file':'')+': '+((err&&err.message)?err.message:err));
        return;
      }
      const hasContent=parsed&&(parsed.tracks.length||parsed.waypoints.length||(parsed.polygons&&parsed.polygons.length));
      if(!hasContent){alert('No usable track was found in this file.');return;}
      const baseName=file.name.replace(/\.(gpx|geojson|json|fit)$/i,'');

      // SPLIT: one route entry per track
      parsed.tracks.forEach((trk,tIdx)=>{
        const name=trk.name&&trk.name.trim()?trk.name.trim():parsed.tracks.length===1?baseName:baseName+' ('+(tIdx+1)+')';
        const color=USER_COLORS[colorIdx%USER_COLORS.length];colorIdx++;
        addUserRoute(name,{tracks:[trk],waypoints:[],polygons:[]},color,5);
      });

      // SPLIT: one entry for all waypoints combined
      if(parsed.waypoints.length){
        const name=baseName;
        const color=USER_COLORS[colorIdx%USER_COLORS.length];colorIdx++;
        addUserRoute(name,{tracks:[],waypoints:parsed.waypoints,polygons:[]},color,8);
      }

      // SPLIT: group polygons.
      // Polygon-only file (no tracks/waypoints): all polygons share one row.
      // Mixed file: group by name (MultiPolygon parts share the same name → one row).
      const vPolygonOnlyFile=parsed.tracks.length===0&&parsed.waypoints.length===0;
      let vPolGroups=[];
      if(vPolygonOnlyFile){
        if((parsed.polygons||[]).length) vPolGroups.push({name:baseName,polygons:parsed.polygons.slice()});
      } else {
        let vPolCounter=0;
        (parsed.polygons||[]).forEach(pol=>{
          const nm=pol.name&&pol.name.trim()?pol.name.trim():null;
          if(nm){
            const ex=vPolGroups.find(g=>g.name===nm);
            if(ex){ex.polygons.push(pol);}
            else{vPolGroups.push({name:nm,polygons:[pol]});}
          } else {
            vPolCounter++;
            vPolGroups.push({name:'__unnamed__'+vPolCounter,polygons:[pol]});
          }
        });
        const vUnnamed=vPolGroups.filter(g=>g.name.startsWith('__unnamed__'));
        vPolGroups.forEach(g=>{
          if(g.name.startsWith('__unnamed__')){
            const n=parseInt(g.name.replace('__unnamed__',''));
            g.name=vUnnamed.length===1?baseName:baseName+' ('+n+')';
          }
        });
      }
      vPolGroups.forEach(g=>{
        const color=USER_COLORS[colorIdx%USER_COLORS.length];colorIdx++;
        addUserRoute(g.name,{tracks:[],waypoints:[],polygons:g.polygons},color,2);
      });
    };
    if(isFit){ reader.readAsArrayBuffer(file); } else { reader.readAsText(file); }
  }

  // --- Map actions: long-press (touch) / right-click (desktop) menu ---
  (function(){
    const menuEl=document.getElementById('map-actions-menu');
    if(!menuEl) return;

    // Group MAP_ACTIONS by their "group" field, preserving first-seen order
    const groupOrder=[];
    const groupMap={};
    const catMap={}; (typeof MAP_CATEGORIES!=='undefined'?MAP_CATEGORIES:[]).forEach(c=>{ catMap[c.name]=c; });
    MAP_ACTIONS.forEach(a=>{
      if(!groupMap[a.group]){ groupMap[a.group]=[]; groupOrder.push(a.group); }
      groupMap[a.group].push(a);
    });

    let currentLatLng=null;

    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

    function fillTemplate(tpl,latlng,fromCoords){
      const lat=latlng.lat.toFixed(5), lon=latlng.lng.toFixed(5), zoom=Math.round(map.getZoom());
      // EPSG:3857 (Web Mercator) metres, for services that expect projected coordinates
      const merc=L.CRS.EPSG3857.project(latlng);
      const x=Math.round(merc.x), y=Math.round(merc.y);
      const HALF_SQUARE_M=250; // 500m x 500m square centered on the tapped point
      const xmin=x-HALF_SQUARE_M, ymin=y-HALF_SQUARE_M, xmax=x+HALF_SQUARE_M, ymax=y+HALF_SQUARE_M;
      let result=tpl.replace(/{lat}/g,lat).replace(/{lon}/g,lon).replace(/{zoom}/g,zoom)
                .replace(/{x}/g,x).replace(/{y}/g,y)
                .replace(/{xmin}/g,xmin).replace(/{ymin}/g,ymin).replace(/{xmax}/g,xmax).replace(/{ymax}/g,ymax);
      if(fromCoords){
        result=result.replace(/{fromlat}/g,fromCoords.lat.toFixed(5)).replace(/{fromlon}/g,fromCoords.lon.toFixed(5));
      }
      return result;
    }

    // --- BRouter: calculate the route ourselves and add it to the map exactly ---
    // --- like an imported GPX/GeoJSON file, instead of sending the visitor    ---
    // --- to a website.                                                        ---
    // Recognises both the clean API form the actions now use:
    //   https://brouter.de/brouter?lonlats=...&profile=...&format=geojson
    // and the older brouter-web form (kept working for older exports):
    //   https://brouter.de/brouter-web/#...&lonlats=...&profile=...
    function isBrouterWebUrl(tpl){
      const s=String(tpl).toLowerCase();
      return s.indexOf('brouter.de/brouter')!==-1 || s.indexOf('/brouter?')!==-1;
    }
    // OSRM (FOSSGIS) car actions use a clean path-based URL; recognise them and pull
    // the lon,lat;lon,lat coordinate list out of the /driving/... path.
    function isOsrmUrl(tpl){ return String(tpl).toLowerCase().indexOf('routing.openstreetmap.de')!==-1; }
    function extractOsrmLonlats(filledUrl){
      var s=String(filledUrl), d=s.indexOf('/driving/');
      if(d<0) return '';
      var rest=s.substring(d+9), q=rest.indexOf('?');
      if(q>=0) rest=rest.substring(0,q);
      return rest.split(';').join('|');
    }

    // Pull lonlats / profile / nogos out of a filled BRouter URL, whether the
    // parameters live in the query string (?a=b&c=d) or after the # (brouter-web
    // hash form). We just scan both parts.
    function extractBrouterParams(filledUrl){
      let query='';
      const qIdx=filledUrl.indexOf('?');
      const hIdx=filledUrl.indexOf('#');
      if(qIdx>=0) query+=filledUrl.slice(qIdx+1, hIdx>qIdx?hIdx:undefined);
      if(hIdx>=0) query+=(query?'&':'')+filledUrl.slice(hIdx+1);
      if(!query) query=filledUrl;
      const params=new URLSearchParams(query);
      return {
        lonlats:params.get('lonlats')||'',
        profile:params.get('profile')||'trekking',
        nogos:params.get('nogos')||'',
        // Allow the action to point at a different BRouter server by writing the
        // full endpoint in its urlTemplate; default to the public one. (Parsed
        // without a regex on purpose: this code lives inside a template string,
        // so backslash escapes like / would be stripped and break a regex.)
        server:(function(){
          const s=String(filledUrl);
          const cut=s.search(/[?#]/);
          const base=cut>=0?s.slice(0,cut):s;
          const low=base.toLowerCase();
          if((low.startsWith('http://')||low.startsWith('https://')) && low.endsWith('/brouter')){
            return base;
          }
          return 'https://brouter.de/brouter';
        })()
      };
    }

    // Default name when BRouter doesn't supply one itself, e.g. turns
    // "Route by foot (Brouter)" into "Route by foot".
    function defaultBrouterName(actionName){
      let s=String(actionName||'').trim();
      const low=s.toLowerCase();
      if(low.endsWith('(brouter)')){
        s=s.slice(0,s.length-'(brouter)'.length).trim();
      }
      return s||'BRouter route';
    }

    async function showBrouterRoute(lonlats,profile,nogos,defaultName,server,icon,lineColor){
      if(!lonlats){ alert('No route coordinates found for this action.'); return false; }
      const endpoint=server||'https://brouter.de/brouter';
      var prof=String(profile||'').toLowerCase();
      // Car routing goes to OSRM (FOSSGIS) instead of BRouter: OSRM is purpose-built
      // for cars, far faster, and handles long routes that BRouter's public server
      // often kills. Bike/foot profiles stay on BRouter (its strength).
      var isOsrm=(prof.indexOf('car')===0);
      showToast('Calculating route…');
      try{
        let apiUrl;
        if(isOsrm){
          apiUrl='https://routing.openstreetmap.de/routed-car/route/v1/driving/'+lonlats.split('|').join(';')+'?overview=full&geometries=geojson';
        } else {
          apiUrl=endpoint+'?lonlats='+encodeURIComponent(lonlats)
            +'&profile='+encodeURIComponent(profile)+'&alternativeidx=0&format=geojson';
          if(nogos) apiUrl+='&nogos='+encodeURIComponent(nogos);
        }
        // The public BRouter server can transiently kill a request ("operation
        // killed by thread priority watchdog") when it is busy. Retry a couple of
        // times with a short pause before giving up, so a heavy moment does not
        // throw the route away.
        let resp=null, lastMsg='';
        for(let attempt=0; attempt<3; attempt++){
          try{
            const r=await fetch(apiUrl);
            if(r.ok){ resp=r; break; }
            const txt=await r.text();
            lastMsg='HTTP '+r.status+' '+txt.slice(0,200);
            var transient=(r.status>=500) || (txt.indexOf('watchdog')>=0) || (txt.indexOf('killed')>=0) || (txt.indexOf('thread priority')>=0);
            if(attempt<2 && transient){ showToast('Routing server is busy, retrying…'); await new Promise(function(res){ setTimeout(res, 800*(attempt+1)); }); continue; }
            throw new Error(lastMsg);
          }catch(e){
            lastMsg=(e&&e.message)?e.message:String(e);
            if(attempt<2){ await new Promise(function(res){ setTimeout(res, 800*(attempt+1)); }); continue; }
            throw new Error(lastMsg);
          }
        }
        if(!resp) throw new Error(lastMsg||'no response');
        const data=await resp.json();
        let geojson;
        if(isOsrm){
          if(!data || data.code!=='Ok' || !data.routes || !data.routes.length || !data.routes[0].geometry){
            throw new Error('OSRM did not return a route ('+((data&&data.code)||'no route')+').');
          }
          geojson={type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:data.routes[0].geometry}]};
        } else {
          geojson=data;
        }
        console.log('Routing response for "'+defaultName+'":',geojson);
        // Reuse the same GeoJSON parser and route-adding logic as the
        // "+ GeoJSON" import button, so the result behaves identically:
        // its own row (with km arrows) in the Imported files panel, and a
        // "remove" option there.
        const parsed=parseUserGeoJSON(JSON.stringify(geojson));
        const hasContent=parsed&&(parsed.tracks.length||parsed.waypoints.length||(parsed.polygons&&parsed.polygons.length));
        if(!hasContent){ console.warn('parseUserGeoJSON found no usable geometry in the routing response above.'); alert('The routing server did not return any route geometry for this location.'); return false; }

        parsed.tracks.forEach((trk,tIdx)=>{
          pendingRouteIcon=icon||null;   // gives the row its profile icon (routes only, not imports)
          // Name the route after the action itself (from the input file), e.g.
          // "Bicycle (Trekking)", not BRouter's internal name ("brouter_trekking_0").
          // Overwrite trk.name too so the on-map label matches the list entry.
          const name=(parsed.tracks.length===1?defaultName:defaultName+' ('+(tIdx+1)+')');
          trk.name=name;
          let color; if(lineColor){ color=lineColor; } else { color=USER_COLORS[colorIdx%USER_COLORS.length]; colorIdx++; }
          addUserRoute(name,{tracks:[trk],waypoints:[],polygons:[]},color,5);
        });
        if(parsed.waypoints.length){
          const color=USER_COLORS[colorIdx%USER_COLORS.length];colorIdx++;
          addUserRoute(defaultName,{tracks:[],waypoints:parsed.waypoints,polygons:[]},color,8);
        }
        (parsed.polygons||[]).forEach(pol=>{
          const color=USER_COLORS[colorIdx%USER_COLORS.length];colorIdx++;
          addUserRoute(pol.name&&pol.name.trim()?pol.name.trim():defaultName,{tracks:[],waypoints:[],polygons:[pol]},color,2);
        });
        // Credit the routing engine — added once, the first time a route is calculated
        if(isOsrm){
          if(!window.__osrmAttr){ map.attributionControl.addAttribution('Routing &copy; <a href="https://routing.openstreetmap.de" target="_blank" rel="noopener">OSRM (FOSSGIS)</a>'); window.__osrmAttr=true; }
        } else {
          if(!window.__brouterAttr){ map.attributionControl.addAttribution('Routing &copy; <a href="https://brouter.de" target="_blank" rel="noopener">BRouter</a>'); window.__brouterAttr=true; }
        }
        return true;
      }catch(err){
        console.error('Route calculation failed:',err);
        var msg=(err&&err.message?err.message:String(err));
        if(isOsrm){
          alert('Could not calculate the car route (OSRM): '+msg);
        } else if(msg.indexOf('watchdog')>=0 || msg.indexOf('killed')>=0 || msg.indexOf('thread priority')>=0){
          alert('The public BRouter server was too busy to finish this route (killed by its watchdog). Your points are still here — tap "Route is OK" again in a moment, or add a via-point to split a long leg.');
        } else {
          alert('Could not calculate the BRouter route: '+msg);
        }
        return false;
      }
    }

    function openUrl(url){
      if(/^https?:/i.test(url)){
        window.open(url,'_blank','noopener');
      } else {
        // Non-http URI (e.g. geo:...) — hand off directly so the OS/browser can route it
        // to an installed app; window.open() is unreliable for custom schemes.
        window.location.href=url;
      }

    function openAction(a){
      if(!currentLatLng) return;
      const latlng=currentLatLng; // capture before closeMenu() clears currentLatLng
      const needsCurrentLocation=/{fromlat}|{fromlon}/.test(a.urlTemplate);
      const isBrouter=isBrouterWebUrl(a.urlTemplate);
      const isOsrm=isOsrmUrl(a.urlTemplate);

      function finish(filledUrl){
        if(isOsrm){
          showBrouterRoute(extractOsrmLonlats(filledUrl),'car',null,defaultBrouterName(a.name),null,{svg:a.iconSvg,color:a.iconColor});
        } else if(isBrouter){
          const {lonlats,profile,nogos,server}=extractBrouterParams(filledUrl);
          showBrouterRoute(lonlats,profile,nogos,defaultBrouterName(a.name),server,{svg:a.iconSvg,color:a.iconColor});
        } else {
          openUrl(filledUrl);
        }
        closeMenu();
        searchActive=false;   // an action was taken: the map may follow your location again
      }

      if(!needsCurrentLocation){
        finish(fillTemplate(a.urlTemplate,latlng));
        return;
      }
      // This action's URL also needs where the visitor currently is (e.g. for
      // "navigate from here to there" links) — ask the browser for that first.
      if(!navigator.geolocation){
        alert('Your browser does not support location services, so this link cannot be completed.');
        closeMenu();
        return;
      }
      showToast('Getting your current location…');
      navigator.geolocation.getCurrentPosition(
        pos=>{
          const fromCoords={lat:pos.coords.latitude,lon:pos.coords.longitude};
          finish(fillTemplate(a.urlTemplate,latlng,fromCoords));
        },
        err=>{
          alert('Could not get your current location ('+(err&&err.message?err.message:'permission denied or unavailable')+'), so this link could not be completed.');
          closeMenu();
        },
        {enableHighAccuracy:false,timeout:20000,maximumAge:60000}
      );
    }

    function buildShareMapUrl(latlng){
      const lat=latlng.lat.toFixed(6), lon=latlng.lng.toFixed(6), zoom=Math.round(map.getZoom());
      let url=location.origin+location.pathname+'#lat='+lat+'&lng='+lon+'&z='+zoom+'&marker='+lat+','+lon;
      // Carry the currently-ticked extra layers along, so opening the shared link
      // reopens the map with exactly the same overlays switched on. Same encoding
      // that parseStateFromHash() reads back (one 1/0 per layer, in list order).
      if(wmsLayerObjs.length){
        url+='&layers='+wmsLayerObjs.map(lo=>lo&&lo.layer&&map.hasLayer(lo.layer)?'1':'0').join(',');
      }
      return url;
    }

    // "Desktop site" on a phone makes the browser ignore this page's mobile viewport:
// everything is laid out ~980px wide and scaled down, and tapping a field zooms in,
// pushing the controls off-screen. Warn once so the user can switch it off.
function looksLikeDesktopMode(){
  try{
    var touch=(navigator.maxTouchPoints||0)>0 || ("ontouchstart" in window);
    if(!touch) return false;
    if(window.innerWidth<900) return false;
    var smallScreen=!!(window.screen && window.screen.width && window.screen.width<900);
    var zoomedOut=!!(window.visualViewport && window.visualViewport.scale && window.visualViewport.scale<0.9);
    return smallScreen||zoomedOut;
  }catch(e){ return false; }
}

},1500);

    const SAVED_POINTS_KEY='PeeWeeTrails_savedPoints__'+location.pathname;

    function renderSavedPoint(p){

    function saveLocationHere(){
