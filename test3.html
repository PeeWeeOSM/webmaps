  // --- Map actions: long-press (touch) / right-click (desktop) menu ---
  (function(){
    const menuEl=document.getElementById('map-actions-menu');
    if(!menuEl) return;

    // Group MAP_ACTIONS by their "group" field, preserving first-seen order
    const groupOrder=[];
    const groupMap={};
    const catMap={}; (typeof MAP_CATEGORIES!=='undefined'?MAP_CATEGORIES:[]).forEach(c=>{ catMap[c.name]=c; });
    MAP_ACTIONS.forEach(a=>{
      if(!groupMap[a.group]){ groupMap[a.group]=[]; groupOrder.push(a.group); }
      groupMap[a.group].push(a);
    });

    let currentLatLng=null;

    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

    function fillTemplate(tpl,latlng,fromCoords){
      const lat=latlng.lat.toFixed(5), lon=latlng.lng.toFixed(5), zoom=Math.round(map.getZoom());
      // EPSG:3857 (Web Mercator) metres, for services that expect projected coordinates
      const merc=L.CRS.EPSG3857.project(latlng);
      const x=Math.round(merc.x), y=Math.round(merc.y);
      const HALF_SQUARE_M=250; // 500m x 500m square centered on the tapped point
      const xmin=x-HALF_SQUARE_M, ymin=y-HALF_SQUARE_M, xmax=x+HALF_SQUARE_M, ymax=y+HALF_SQUARE_M;
      let result=tpl.replace(/{lat}/g,lat).replace(/{lon}/g,lon).replace(/{zoom}/g,zoom)
                .replace(/{x}/g,x).replace(/{y}/g,y)
                .replace(/{xmin}/g,xmin).replace(/{ymin}/g,ymin).replace(/{xmax}/g,xmax).replace(/{ymax}/g,ymax);
      if(fromCoords){
        result=result.replace(/{fromlat}/g,fromCoords.lat.toFixed(5)).replace(/{fromlon}/g,fromCoords.lon.toFixed(5));
      }
      return result;
    }

    // --- BRouter: calculate the route ourselves and add it to the map exactly ---
    // --- like an imported GPX/GeoJSON file, instead of sending the visitor    ---
    // --- to a website.                                                        ---
    // Recognises both the clean API form the actions now use:
    //   https://brouter.de/brouter?lonlats=...&profile=...&format=geojson
    // and the older brouter-web form (kept working for older exports):
    //   https://brouter.de/brouter-web/#...&lonlats=...&profile=...
    function isBrouterWebUrl(tpl){
      const s=String(tpl).toLowerCase();
      return s.indexOf('brouter.de/brouter')!==-1 || s.indexOf('/brouter?')!==-1;
    }
    // OSRM (FOSSGIS) car actions use a clean path-based URL; recognise them and pull
    // the lon,lat;lon,lat coordinate list out of the /driving/... path.
    function isOsrmUrl(tpl){ return String(tpl).toLowerCase().indexOf('routing.openstreetmap.de')!==-1; }
    function extractOsrmLonlats(filledUrl){
      var s=String(filledUrl), d=s.indexOf('/driving/');
      if(d<0) return '';
      var rest=s.substring(d+9), q=rest.indexOf('?');
      if(q>=0) rest=rest.substring(0,q);
      return rest.split(';').join('|');
    }

    // Pull lonlats / profile / nogos out of a filled BRouter URL, whether the
    // parameters live in the query string (?a=b&c=d) or after the # (brouter-web
    // hash form). We just scan both parts.
    function extractBrouterParams(filledUrl){
      let query='';
      const qIdx=filledUrl.indexOf('?');
      const hIdx=filledUrl.indexOf('#');
      if(qIdx>=0) query+=filledUrl.slice(qIdx+1, hIdx>qIdx?hIdx:undefined);
      if(hIdx>=0) query+=(query?'&':'')+filledUrl.slice(hIdx+1);
      if(!query) query=filledUrl;
      const params=new URLSearchParams(query);
      return {
        lonlats:params.get('lonlats')||'',
        profile:params.get('profile')||'trekking',
        nogos:params.get('nogos')||'',
        // Allow the action to point at a different BRouter server by writing the
        // full endpoint in its urlTemplate; default to the public one. (Parsed
        // without a regex on purpose: this code lives inside a template string,
        // so backslash escapes like / would be stripped and break a regex.)
        server:(function(){
          const s=String(filledUrl);
          const cut=s.search(/[?#]/);
          const base=cut>=0?s.slice(0,cut):s;
          const low=base.toLowerCase();
          if((low.startsWith('http://')||low.startsWith('https://')) && low.endsWith('/brouter')){
            return base;
          }
          return 'https://brouter.de/brouter';
        })()
      };
    }

    // Default name when BRouter doesn't supply one itself, e.g. turns
    // "Route by foot (Brouter)" into "Route by foot".
    function defaultBrouterName(actionName){
      let s=String(actionName||'').trim();
      const low=s.toLowerCase();
      if(low.endsWith('(brouter)')){
        s=s.slice(0,s.length-'(brouter)'.length).trim();
      }
      return s||'BRouter route';
    }

    async function showBrouterRoute(lonlats,profile,nogos,defaultName,server,icon,lineColor){
      if(!lonlats){ alert('No route coordinates found for this action.'); return false; }
      const endpoint=server||'https://brouter.de/brouter';
      var prof=String(profile||'').toLowerCase();
      // Car routing goes to OSRM (FOSSGIS) instead of BRouter: OSRM is purpose-built
      // for cars, far faster, and handles long routes that BRouter's public server
      // often kills. Bike/foot profiles stay on BRouter (its strength).
      var isOsrm=(prof.indexOf('car')===0);
      showToast('Calculating route…');
      try{
        let apiUrl;
        if(isOsrm){
          apiUrl='https://routing.openstreetmap.de/routed-car/route/v1/driving/'+lonlats.split('|').join(';')+'?overview=full&geometries=geojson';
        } else {
          apiUrl=endpoint+'?lonlats='+encodeURIComponent(lonlats)
            +'&profile='+encodeURIComponent(profile)+'&alternativeidx=0&format=geojson';
          if(nogos) apiUrl+='&nogos='+encodeURIComponent(nogos);
        }
        // The public BRouter server can transiently kill a request ("operation
        // killed by thread priority watchdog") when it is busy. Retry a couple of
        // times with a short pause before giving up, so a heavy moment does not
        // throw the route away.
        let resp=null, lastMsg='';
        for(let attempt=0; attempt<3; attempt++){
          try{
            const r=await fetch(apiUrl);
            if(r.ok){ resp=r; break; }
            const txt=await r.text();
            lastMsg='HTTP '+r.status+' '+txt.slice(0,200);
            var transient=(r.status>=500) || (txt.indexOf('watchdog')>=0) || (txt.indexOf('killed')>=0) || (txt.indexOf('thread priority')>=0);
            if(attempt<2 && transient){ showToast('Routing server is busy, retrying…'); await new Promise(function(res){ setTimeout(res, 800*(attempt+1)); }); continue; }
            throw new Error(lastMsg);
          }catch(e){
            lastMsg=(e&&e.message)?e.message:String(e);
            if(attempt<2){ await new Promise(function(res){ setTimeout(res, 800*(attempt+1)); }); continue; }
            throw new Error(lastMsg);
          }
        }
        if(!resp) throw new Error(lastMsg||'no response');
        const data=await resp.json();
        let geojson;
        if(isOsrm){
          if(!data || data.code!=='Ok' || !data.routes || !data.routes.length || !data.routes[0].geometry){
            throw new Error('OSRM did not return a route ('+((data&&data.code)||'no route')+').');
          }
          geojson={type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:data.routes[0].geometry}]};
        } else {
          geojson=data;
        }
        console.log('Routing response for "'+defaultName+'":',geojson);
        // Reuse the same GeoJSON parser and route-adding logic as the
        // "+ GeoJSON" import button, so the result behaves identically:
        // its own row (with km arrows) in the Imported files panel, and a
        // "remove" option there.
        const parsed=parseUserGeoJSON(JSON.stringify(geojson));
        const hasContent=parsed&&(parsed.tracks.length||parsed.waypoints.length||(parsed.polygons&&parsed.polygons.length));
        if(!hasContent){ console.warn('parseUserGeoJSON found no usable geometry in the routing response above.'); alert('The routing server did not return any route geometry for this location.'); return false; }

        parsed.tracks.forEach((trk,tIdx)=>{
          pendingRouteIcon=icon||null;   // gives the row its profile icon (routes only, not imports)
          // Name the route after the action itself (from the input file), e.g.
          // "Bicycle (Trekking)", not BRouter's internal name ("brouter_trekking_0").
          // Overwrite trk.name too so the on-map label matches the list entry.
          const name=(parsed.tracks.length===1?defaultName:defaultName+' ('+(tIdx+1)+')');
          trk.name=name;
          let color; if(lineColor){ color=lineColor; } else { color=USER_COLORS[colorIdx%USER_COLORS.length]; colorIdx++; }
          addUserRoute(name,{tracks:[trk],waypoints:[],polygons:[]},color,5);
        });
        if(parsed.waypoints.length){
          const color=USER_COLORS[colorIdx%USER_COLORS.length];colorIdx++;
          addUserRoute(defaultName,{tracks:[],waypoints:parsed.waypoints,polygons:[]},color,8);
        }
        (parsed.polygons||[]).forEach(pol=>{
          const color=USER_COLORS[colorIdx%USER_COLORS.length];colorIdx++;
          addUserRoute(pol.name&&pol.name.trim()?pol.name.trim():defaultName,{tracks:[],waypoints:[],polygons:[pol]},color,2);
        });
        // Credit the routing engine — added once, the first time a route is calculated
        if(isOsrm){
          if(!window.__osrmAttr){ map.attributionControl.addAttribution('Routing &copy; <a href="https://routing.openstreetmap.de" target="_blank" rel="noopener">OSRM (FOSSGIS)</a>'); window.__osrmAttr=true; }
        } else {
          if(!window.__brouterAttr){ map.attributionControl.addAttribution('Routing &copy; <a href="https://brouter.de" target="_blank" rel="noopener">BRouter</a>'); window.__brouterAttr=true; }
        }
        return true;
      }catch(err){
        console.error('Route calculation failed:',err);
        var msg=(err&&err.message?err.message:String(err));
        if(isOsrm){
          alert('Could not calculate the car route (OSRM): '+msg);
        } else if(msg.indexOf('watchdog')>=0 || msg.indexOf('killed')>=0 || msg.indexOf('thread priority')>=0){
          alert('The public BRouter server was too busy to finish this route (killed by its watchdog). Your points are still here — tap "Route is OK" again in a moment, or add a via-point to split a long leg.');
        } else {
          alert('Could not calculate the BRouter route: '+msg);
        }
        return false;
      }
    }

    let tempMarker=null;


    function showTempMarker(latlng){
      removeTempMarker();
      const tempIcon=L.divIcon({
        className:'',
        html:'<svg width="26" height="34" viewBox="0 0 34 44" xmlns="http://www.w3.org/2000/svg"><path d="M17 0C7.6 0 0 7.6 0 17c0 12.2 17 27 17 27s17-14.8 17-27C34 7.6 26.4 0 17 0z" fill="#2980b9" stroke="#fff" stroke-width="2"/><circle cx="17" cy="17" r="6" fill="#fff"/></svg>',
        iconSize:[26,34],
        iconAnchor:[13,34]
      });
      tempMarker=L.marker(latlng,{icon:tempIcon,zIndexOffset:3000,interactive:false}).addTo(map);
    }

    function removeTempMarker(){
      if(tempMarker){ map.removeLayer(tempMarker); tempMarker=null; }
    }

    function closeMenu(){
      menuEl.classList.remove('open');
      menuEl.innerHTML='';
      currentLatLng=null;
      removeTempMarker();
    }

    function openUrl(url){
      if(/^https?:/i.test(url)){
        window.open(url,'_blank','noopener');
      } else {
        // Non-http URI (e.g. geo:...) — hand off directly so the OS/browser can route it
        // to an installed app; window.open() is unreliable for custom schemes.
        window.location.href=url;
      }
    }

    function openAction(a){
      if(!currentLatLng) return;
      const latlng=currentLatLng; // capture before closeMenu() clears currentLatLng
      const needsCurrentLocation=/{fromlat}|{fromlon}/.test(a.urlTemplate);
      const isBrouter=isBrouterWebUrl(a.urlTemplate);
      const isOsrm=isOsrmUrl(a.urlTemplate);

      function finish(filledUrl){
        if(isOsrm){
          showBrouterRoute(extractOsrmLonlats(filledUrl),'car',null,defaultBrouterName(a.name),null,{svg:a.iconSvg,color:a.iconColor});
        } else if(isBrouter){
          const {lonlats,profile,nogos,server}=extractBrouterParams(filledUrl);
          showBrouterRoute(lonlats,profile,nogos,defaultBrouterName(a.name),server,{svg:a.iconSvg,color:a.iconColor});
        } else {
          openUrl(filledUrl);
        }
        closeMenu();
        searchActive=false;   // an action was taken: the map may follow your location again
      }

      if(!needsCurrentLocation){
        finish(fillTemplate(a.urlTemplate,latlng));
        return;
      }
      // This action's URL also needs where the visitor currently is (e.g. for
      // "navigate from here to there" links) — ask the browser for that first.
      if(!navigator.geolocation){
        alert('Your browser does not support location services, so this link cannot be completed.');
        closeMenu();
        return;
      }
      showToast('Getting your current location…');
      navigator.geolocation.getCurrentPosition(
        pos=>{
          const fromCoords={lat:pos.coords.latitude,lon:pos.coords.longitude};
          finish(fillTemplate(a.urlTemplate,latlng,fromCoords));
        },
        err=>{
          alert('Could not get your current location ('+(err&&err.message?err.message:'permission denied or unavailable')+'), so this link could not be completed.');
          closeMenu();
        },
        {enableHighAccuracy:false,timeout:20000,maximumAge:60000}
      );
    }

    function buildShareMapUrl(latlng){
      const lat=latlng.lat.toFixed(6), lon=latlng.lng.toFixed(6), zoom=Math.round(map.getZoom());
      let url=location.origin+location.pathname+'#lat='+lat+'&lng='+lon+'&z='+zoom+'&marker='+lat+','+lon;
      // Carry the currently-ticked extra layers along, so opening the shared link
      // reopens the map with exactly the same overlays switched on. Same encoding
      // that parseStateFromHash() reads back (one 1/0 per layer, in list order).
      if(wmsLayerObjs.length || liveLayerObjs.length){
        url+='&layers='+wmsLayerObjs.map(lo=>lo&&lo.layer&&map.hasLayer(lo.layer)?'1':'0').concat(liveLayerObjs.map(lo=>lo.isOn()?'1':'0')).join(',');
      }
      if(extraOrder.length>1){ url+='&order='+extraOrder.join(','); }
      return url;
    }

    // "Desktop site" on a phone makes the browser ignore this page's mobile viewport:
// everything is laid out ~980px wide and scaled down, and tapping a field zooms in,
// pushing the controls off-screen. Warn once so the user can switch it off.
function looksLikeDesktopMode(){
  try{
    var touch=(navigator.maxTouchPoints||0)>0 || ("ontouchstart" in window);
    if(!touch) return false;
    if(window.innerWidth<900) return false;
    var smallScreen=!!(window.screen && window.screen.width && window.screen.width<900);
    var zoomedOut=!!(window.visualViewport && window.visualViewport.scale && window.visualViewport.scale<0.9);
    return smallScreen||zoomedOut;
  }catch(e){ return false; }
}
setTimeout(function(){
  if(looksLikeDesktopMode()) showToast('Tip: switch off "Desktop site" in your browser menu — this map works best in the normal mobile view.',8000);
},1500);
window.showToast=showToast;   // the GPX helpers live in the global scope and use it too
function showToast(msg,duration){
      let t=document.getElementById('mam-toast');
      if(!t){
        t=document.createElement('div');
        t.id='mam-toast';
        t.style.cssText='position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:white;padding:8px 16px;border-radius:20px;font-size:13px;z-index:1400;pointer-events:none;transition:opacity .3s';
        document.getElementById('map-wrap').appendChild(t);
      }
      t.textContent=msg;
      t.style.opacity='1';
      clearTimeout(t._hideTimer);
      t._hideTimer=setTimeout(()=>{ t.style.opacity='0'; },duration||2000);
    }

    function shareThisMap(){
      if(!currentLatLng) return;
      const url=buildShareMapUrl(currentLatLng);
      if(navigator.share){
        navigator.share({title:document.title,url:url}).catch(()=>{});
      } else if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(()=>showToast('Link copied to clipboard')).catch(()=>window.prompt('Copy this link:',url));
      } else {
        window.prompt('Copy this link:',url);
      }
      closeMenu();
    }

    // --- Saved locations (e.g. "where I parked") — persisted in this browser via
    // localStorage, scoped to this exact page, so they survive closing the tab,
    // the browser, or the phone itself. They only disappear if this browser's
    // site data for this page gets cleared, or on a different device/browser.
    const SAVED_POINTS_KEY='PeeWeeTrails_savedPoints__'+location.pathname;
    const savedPointLayers={};

    function loadSavedPoints(){
      try{
        const raw=localStorage.getItem(SAVED_POINTS_KEY);
        return raw?JSON.parse(raw):[];
      }catch(e){ return []; }
    }

    function persistSavedPoints(points){
      try{ localStorage.setItem(SAVED_POINTS_KEY, JSON.stringify(points)); }catch(e){}
    }

    function buildSavedPointIcon(label){
      const haloColor='#fff';
      const hw='2px';
      const labelHtml='<div style="position:absolute;left:32px;top:6px;white-space:nowrap;color:#8e44ad;font-size:13px;font-weight:700;pointer-events:none;'+
        'text-shadow:-'+hw+' -'+hw+' 0 '+haloColor+','+hw+' -'+hw+' 0 '+haloColor+',-'+hw+' '+hw+' 0 '+haloColor+','+hw+' '+hw+' 0 '+haloColor+',0 '+hw+' 0 '+haloColor+',0 -'+hw+' 0 '+haloColor+','+hw+' 0 0 '+haloColor+',-'+hw+' 0 0 '+haloColor+'">'+esc(label)+'</div>';
      return L.divIcon({
        className:'',
        html:'<div style="position:relative;width:28px;height:36px">'+
          '<svg width="28" height="36" viewBox="0 0 34 44" xmlns="http://www.w3.org/2000/svg"><path d="M17 0C7.6 0 0 7.6 0 17c0 12.2 17 27 17 27s17-14.8 17-27C34 7.6 26.4 0 17 0z" fill="#8e44ad" stroke="#fff" stroke-width="2"/><path d="M17 9l2.4 5.1 5.6.6-4.2 3.8 1.2 5.5-4.6-2.8-4.9 2.8 1.2-5.5-4.2-3.8 5.6-.6z" fill="#fff"/></svg>'+
          labelHtml+
        '</div>',
        iconSize:[28,36],
        iconAnchor:[14,36]
      });
    }

    function renderSavedPoint(p){
      const marker=L.marker([p.lat,p.lng],{icon:buildSavedPointIcon(p.label),zIndexOffset:1500}).addTo(map);
      const popupEl=document.createElement('div');
      popupEl.innerHTML='<b>'+esc(p.label)+'</b><br><button type="button" class="saved-point-remove">Remove</button>';
      popupEl.querySelector('.saved-point-remove').addEventListener('click',()=>{
        removeSavedPoint(p.id);
        marker.closePopup();
      });
      marker.bindPopup(popupEl);
      savedPointLayers[p.id]=marker;
    }

    function renderAllSavedPoints(){
      loadSavedPoints().forEach(renderSavedPoint);
    }

    function removeSavedPoint(id){
      const points=loadSavedPoints().filter(p=>p.id!==id);
      persistSavedPoints(points);
      if(savedPointLayers[id]){
        map.removeLayer(savedPointLayers[id]);
        delete savedPointLayers[id];
      }
    }

    function saveLocationHere(){
      if(!currentLatLng) return;
      const latlng=currentLatLng; // capture before closeMenu() clears currentLatLng
      const now=new Date();
      const dateStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
      const defaultLabel=dateStr+' parked car';
      const label=window.prompt('Label for this location:',defaultLabel);
      closeMenu();
      if(label===null) return; // cancelled
      const point={
        id:'p'+Date.now()+Math.random().toString(36).slice(2,7),
        lat:latlng.lat,
        lng:latlng.lng,
        label:(label.trim()||defaultLabel),
        createdAt:Date.now()
      };
      const points=loadSavedPoints();
      points.push(point);
      persistSavedPoints(points);
      renderSavedPoint(point);
      showToast('Location saved — it will still be here next time you open this map on this device.',5000);
    }

    let lastClientX=0, lastClientY=0;

    function clampMenuPosition(){
      const wrap=document.getElementById('map-wrap');
      const wrapRect=wrap.getBoundingClientRect();
      menuEl.style.left='0px'; menuEl.style.top='0px'; // reset before measuring actual size
      const mw=menuEl.offsetWidth||200, mh=menuEl.offsetHeight||120;
      let x=Math.min(Math.max(8,lastClientX-wrapRect.left), wrapRect.width-mw-8);
      let y=Math.min(Math.max(8,lastClientY-wrapRect.top), wrapRect.height-mh-8);
      menuEl.style.left=x+'px';
      menuEl.style.top=y+'px';
    }

    // ---------- "Route from here": build a route with via points (BRouter-Web style) ----------
    // Profiles come from the configured "Route to" actions, so this stays in sync with
    // whatever is set up in the Creator (Foot, Bicycle ..., Car ...).
    const rfPanel=document.getElementById('rf-panel');
    const rfTitle=document.getElementById('rf-title');
    const rfProfilesEl=document.getElementById('rf-profiles');
    const rfEditEl=document.getElementById('rf-edit');
    const rfStat=document.getElementById('rf-stat');
    const rfOk=document.getElementById('rf-ok');
    const rfCancel=document.getElementById('rf-cancel');
    const rfElevToggle=document.getElementById('rf-elev-toggle');
    const rfElevBox=document.getElementById('rf-elev');
    const rfColorInput=document.getElementById('rf-color');
    const rfEyeBtn=document.getElementById('rf-eye');
    var RF_COLOR_KEY='PeeWeeTrails_set_rfcolor__'+location.pathname;
    let rfColor=(rfColorInput&&rfColorInput.value)||'#e60000';
    // Remember the visitor's chosen route-line colour on this device, so a
    // preference for another colour survives closing and reopening the map.
    try{ var _rfSaved=localStorage.getItem(RF_COLOR_KEY); if(_rfSaved){ rfColor=_rfSaved; if(rfColorInput) rfColorInput.value=_rfSaved; } }catch(e){}
    let rfVisible=true;
    let rfWps=[], rfLine=null, rfHit=null, rfGhost=null, rfCoords=[], rfEle=[], rfElevOpen=false, rfSeq=0;
    var RF_EYE_OPEN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    var RF_EYE_OFF='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>';
    if(rfColorInput){
      rfColorInput.addEventListener('input',function(){
        rfColor=rfColorInput.value||'#e60000';
        if(rfLine) rfLine.setStyle({color:rfColor});
        try{ localStorage.setItem(RF_COLOR_KEY, rfColor); }catch(e){}
      });
    }
    if(rfEyeBtn){
      rfEyeBtn.addEventListener('click',function(e){
        e.stopPropagation();
        rfVisible=!rfVisible;
        rfEyeBtn.innerHTML=rfVisible?RF_EYE_OPEN:RF_EYE_OFF;
        if(rfCoords&&rfCoords.length) rfDrawLine();
      });
    }
    if(rfElevToggle){
      rfElevToggle.addEventListener('click',function(e){
        e.stopPropagation();
        rfElevOpen=!rfElevOpen;
        if(rfElevOpen){ rfElevBox.innerHTML=buildElevSvg(rfCoords,rfEle); rfElevBox.style.display='block'; rfElevToggle.innerHTML='▴ Elevation profile'; }
        else { rfElevBox.style.display='none'; rfElevToggle.innerHTML='▾ Elevation profile'; }
      });
    }
    let rfProfile='', rfProfileName='', rfServer='', rfSuppressClick=0, rfIconSvg=null, rfIconColor=null;

    function rfProfileFromTpl(t){
      if(t.indexOf('routing.openstreetmap.de')>=0){
        return t.indexOf('routed-bike')>=0?'bike':(t.indexOf('routed-foot')>=0?'foot':'car');
      }
      const i=t.indexOf('profile=');
      if(i<0) return '';
      const rest=t.substring(i+8), amp=rest.indexOf('&');
      return amp<0?rest:rest.substring(0,amp);
    }
    function rfServerFromTpl(t){ const q=t.indexOf('?'); return q<0?'':t.substring(0,q); }
    function rfAvailableProfiles(){
      const out=[];
      (typeof MAP_ACTIONS!=='undefined'?MAP_ACTIONS:[]).forEach(function(a){
        const t=a.urlTemplate||'';
        if(t.indexOf('brouter')<0 && t.indexOf('routing.openstreetmap.de')<0) return;
        const p=rfProfileFromTpl(t);
        if(p) out.push({name:a.name, profile:p, server:rfServerFromTpl(t), iconSvg:a.iconSvg, iconColor:a.iconColor, iconImgSrc:a.iconImgSrc});
      });
      return out;
    }
    function rfIcon(i){
      const last=(rfWps.length>1 && i===rfWps.length-1);
      const cls=(i===0)?'rfwp-start':(last?'rfwp-end':'rfwp-via');
      const label=(i===0)?'S':(last?'F':String(i));
      return L.divIcon({className:'',html:'<div class="rfwp '+cls+'">'+label+'</div>',iconSize:[24,24],iconAnchor:[12,12]});
    }
    function rfDraw(){
      rfWps.forEach(function(w,i){
        if(!w.marker){
          w.marker=L.marker([w.lat,w.lng],{icon:rfIcon(i),draggable:true,zIndexOffset:3000}).addTo(map);
          w.marker.on('click',function(ev){ L.DomEvent.stopPropagation(ev); rfRemove(w); });
          w.marker.on('dragstart',function(){ w.dragging=true; });
          w.marker.on('dragend',function(){ const ll=w.marker.getLatLng(); w.lat=ll.lat; w.lng=ll.lng; w.dragging=false; rfRecalc(); });
        } else {
          w.marker.setIcon(rfIcon(i));
          if(!w.dragging) w.marker.setLatLng([w.lat,w.lng]);
        }
      });
    }
    function rfRemove(w){
      const i=rfWps.indexOf(w); if(i<0) return;
      if(rfWps.length<=1){ showToast('The start point cannot be removed — use × to cancel.'); return; }
      map.removeLayer(w.marker); rfWps.splice(i,1); rfDraw(); rfRecalc();
    }
    function rfAdd(latlng){ rfWps.push({lat:latlng.lat,lng:latlng.lng,marker:null}); rfDraw(); rfRecalc(); }
    function rfLonlats(){ return rfWps.map(function(w){ return w.lng+','+w.lat; }).join('|'); }
    function rfRemoveLineLayers(){
      if(rfLine){ map.removeLayer(rfLine); rfLine=null; }
      if(rfHit){ map.removeLayer(rfHit); rfHit=null; }
    }
    function rfClearLine(){ rfRemoveLineLayers(); rfCoords=[]; rfEle=[]; if(rfElevToggle){rfElevToggle.style.display='none';} if(rfElevBox){rfElevBox.style.display='none';} }
    function rfDrawLine(){
      rfRemoveLineLayers();
      rfLine=L.polyline(rfCoords,{color:rfColor,weight:7,opacity: rfVisible?0.9:0 }).addTo(map);
      if(rfVisible && rfCoords.length>1 && rfLine.setText){
        try{ rfLine.setText('  ▶  ', {repeat:true, offset:4, attributes:{fill:'#ffffff','font-size':'12','font-weight':'bold'}}); }catch(e){}
      }
      rfHit=L.polyline(rfCoords,{color:'#000',weight:24,opacity:0.01,lineCap:'round'}).addTo(map);
      rfEnableDrag();
    }
    function rfNearestIdx(latlng){
      let best=0,bd=Infinity; const p=map.latLngToLayerPoint(latlng);
      for(let i=0;i<rfCoords.length;i++){
        const q=map.latLngToLayerPoint(L.latLng(rfCoords[i][0],rfCoords[i][1]));
        const d=(q.x-p.x)*(q.x-p.x)+(q.y-p.y)*(q.y-p.y);
        if(d<bd){ bd=d; best=i; }
      }
      return best;
    }
    function rfInsertIndex(latlng){
      const idx=rfWps.map(function(w){ return rfNearestIdx(L.latLng(w.lat,w.lng)); });
      const ip=rfNearestIdx(latlng);
      for(let k=1;k<rfWps.length;k++){ if(ip<=idx[k]) return k; }
      return rfWps.length;
    }
    function rfEnableDrag(){
      const el=rfHit.getElement(); if(!el) return;
      el.style.cursor='grab';
      el.style.touchAction='none';   // let the finger drag the line instead of panning the map
      el.addEventListener('pointerdown',function(ev){
        if(!routeEditing) return;
        ev.preventDefault(); ev.stopPropagation();
        const latlng=map.mouseEventToLatLng(ev);
        const at=rfInsertIndex(latlng);
        map.dragging.disable();
        rfGhost=L.marker(latlng,{icon:L.divIcon({className:'',html:'<div class="rfwp rfwp-ghost">+</div>',iconSize:[24,24],iconAnchor:[12,12]}),zIndexOffset:4000}).addTo(map);
        try{ el.setPointerCapture(ev.pointerId); }catch(e){}
        const move=function(e2){ e2.preventDefault(); rfGhost.setLatLng(map.mouseEventToLatLng(e2)); };
        const up=function(){
          el.removeEventListener('pointermove',move);
          el.removeEventListener('pointerup',up);
          el.removeEventListener('pointercancel',up);
          try{ el.releasePointerCapture(ev.pointerId); }catch(e){}
          map.dragging.enable();
          rfSuppressClick=Date.now()+400;   // the browser still fires a click after the drag
          const ll=rfGhost?rfGhost.getLatLng():latlng;
          if(rfGhost){ map.removeLayer(rfGhost); rfGhost=null; }
          rfWps.splice(at,0,{lat:ll.lat,lng:ll.lng,marker:null});
          rfDraw(); rfRecalc();
        };
        el.addEventListener('pointermove',move);
        el.addEventListener('pointerup',up);
        el.addEventListener('pointercancel',up);
      });
    }
    function rfFmtKm(m){ return (m<1000)?(Math.round(m)+' m'):((m/1000).toFixed(1)+' km'); }
    function rfFmtTime(s){ s=Math.round(s); const h=Math.floor(s/3600), m=Math.round((s%3600)/60); return h?(h+' h '+m+' min'):(m+' min'); }
    function rfRecalc(){
      if(rfWps.length<2){ rfClearLine(); rfOk.disabled=true; rfStat.textContent='Start point set. Tap the map to add points.'; return; }
      const seq=++rfSeq;
      rfStat.textContent='Calculating…';
      var isOsrm=(String(rfProfile).toLowerCase().indexOf('car')===0);
      var url;
      if(isOsrm){
        url='https://routing.openstreetmap.de/routed-car/route/v1/driving/'+rfLonlats().split('|').join(';')+'?overview=full&geometries=geojson';
      } else {
        url=(rfServer||'https://brouter.de/brouter')+'?lonlats='+encodeURIComponent(rfLonlats())
          +'&profile='+encodeURIComponent(rfProfile)+'&alternativeidx=0&format=geojson';
      }
      fetch(url).then(function(r){ return r.text(); }).then(function(txt){
        if(seq!==rfSeq) return;   // a newer edit superseded this calculation
        let js=null;
        try{ js=JSON.parse(txt); }catch(e){ rfStat.textContent=(isOsrm?'OSRM: ':'BRouter: ')+txt.slice(0,80); return; }
        let f;
        if(isOsrm){
          if(!js || js.code!=='Ok' || !js.routes || !js.routes.length || !js.routes[0].geometry){ rfStat.textContent='No route found.'; return; }
          f={geometry:js.routes[0].geometry, properties:{'track-length':(js.routes[0].distance||0), 'total-time':(js.routes[0].duration||0)}};
        } else {
          f=js&&js.features&&js.features[0];
        }
        if(!f){ rfStat.textContent='No route found.'; return; }
        rfCoords=f.geometry.coordinates.map(function(c){ return [c[1],c[0]]; });
        rfEle=f.geometry.coordinates.map(function(c){ return (c.length>2&&c[2]!=null&&!isNaN(c[2]))?c[2]:null; });
        rfDrawLine();
        const p=f.properties||{};
        const len=parseFloat(p['track-length']||0), tim=parseFloat(p['total-time']||0);
        const est=elevStats(rfCoords,rfEle);
        let statTxt=rfProfileName+' · '+rfFmtKm(len)+(tim?(' · '+rfFmtTime(tim)):'');
        if(est) statTxt+=' · ↑ '+est.ascent+' m';
        statTxt+=' · '+rfWps.length+' points';
        rfStat.textContent=statTxt;
        if(est&&rfElevToggle){ rfElevToggle.style.display=''; if(rfElevOpen){ rfElevBox.innerHTML=buildElevSvg(rfCoords,rfEle); rfElevBox.style.display='block'; } }
        else if(rfElevToggle){ rfElevToggle.style.display='none'; rfElevBox.style.display='none'; }
        rfOk.disabled=false;
      }).catch(function(){ if(seq===rfSeq) rfStat.textContent='Routing failed — check your connection.'; });
    }
    function startRouteFrom(latlng){
      if(!latlng) return;
      rfCleanup();
      closePanelsExcept('rf-panel');
      routeEditing=true; following=false;
      rfProfile=''; rfProfileName=''; rfServer='';
      rfWps=[{lat:latlng.lat,lng:latlng.lng,marker:null}];
      rfPanel.classList.add('open');
      rfTitle.textContent='Route from — choose a profile';
      rfProfilesEl.style.display='flex';
      rfEditEl.style.display='none';
      rfProfilesEl.innerHTML='';
      const list=rfAvailableProfiles();
      if(!list.length) rfProfilesEl.innerHTML='<span style="font-size:13px;color:#666">No BRouter route actions are configured.</span>';
      list.forEach(function(p){
        const b=document.createElement('button'); b.className='rf-btn';
        const ic=(p.iconSvg)?('<span class="rf-icon" style="color:'+esc(p.iconColor||'#555555')+'">'+p.iconSvg+'</span>')
          :(p.iconImgSrc)?('<span class="rf-icon"><img src="'+esc(p.iconImgSrc)+'" alt=""></span>'):'';
        b.innerHTML=ic+'<span>'+esc(p.name)+'</span>';
        b.addEventListener('click',function(e){ e.stopPropagation(); rfProfile=p.profile; rfProfileName=p.name; rfServer=p.server; rfIconSvg=p.iconSvg||null; rfIconColor=p.iconColor||null; rfEnterEdit(); });
        rfProfilesEl.appendChild(b);
      });
      rfDraw();
    }
    function rfEnterEdit(){
      rfTitle.textContent='Route from — '+rfProfileName;
      rfProfilesEl.style.display='none';
      rfEditEl.style.display='block';
      rfStat.textContent='Start point set. Tap the map to add points.';
      rfOk.disabled=true;
      showToast('Choose a destination or via point');
    }
    function rfCleanup(){
      routeEditing=false;
      rfVisible=true; if(rfEyeBtn) rfEyeBtn.innerHTML=RF_EYE_OPEN;
      rfWps.forEach(function(w){ if(w.marker) map.removeLayer(w.marker); });
      rfWps=[];
      if(rfGhost){ map.removeLayer(rfGhost); rfGhost=null; }
      rfClearLine();
      rfPanel.classList.remove('open');
      map.dragging.enable();
      lastUserInteraction=Date.now();
    }
    map.on('click',function(e){
      if(!routeEditing || !rfProfile) return;
      if(Date.now()<rfSuppressClick) return;   // tail of a line drag, not a real tap
      rfAdd(e.latlng);
    });
    rfOk.addEventListener('click',async function(e){
      e.stopPropagation();
      if(rfWps.length<2) return;
      const lonlats=rfLonlats(), prof=rfProfile, srv=rfServer, nm=rfProfileName;
      const rfIcoSvg=rfIconSvg, rfIcoCol=rfIconColor, col=rfColor;
      rfOk.disabled=true; var _okTxt=rfOk.textContent; rfOk.textContent='Calculating…';
      // Hand the finished route to the same code path as a "Route to" action. Only
      // tear down the builder once the route is actually added — so a transient
      // BRouter failure keeps your points on the map and you can just try again.
      const okDone=await showBrouterRoute(lonlats, prof, null, nm, srv||undefined, {svg:rfIcoSvg, color:rfIcoCol}, col);
      rfOk.disabled=false; rfOk.textContent=_okTxt;
      if(okDone){ rfCleanup(); searchActive=false; }
    });
    rfCancel.addEventListener('click',function(e){ e.stopPropagation(); rfCleanup(); showToast('Cancelled'); });
    rfPanel.addEventListener('click',function(e){ e.stopPropagation(); });

    function catBtnHtml(g,c){
      const catIcon=(c&&c.iconSvg)?('<span class="mam-icon mam-icon-chip" style="color:'+esc(c.iconColor||'#555555')+'">'+c.iconSvg+'</span>')
        :(c&&c.iconImgSrc)?('<span class="mam-icon mam-icon-chip"><img src="'+esc(c.iconImgSrc)+'" alt=""></span>')
        :'<span class="mam-icon">&#128205;</span>';
      return '<button class="mam-item" data-group="'+esc(g)+'">'+catIcon+esc(g)+'</button>';
    }
    function renderGroupLevel(){
      let html='<div class="mam-header">Choose an action</div>';
      const cats=(typeof MAP_CATEGORIES!=='undefined'?MAP_CATEGORIES:[]);
      const shareBtn='<button class="mam-item" data-share-map="1"><span class="mam-icon">&#128279;</span>Share this map here</button>';
      const saveBtn='<button class="mam-item" data-save-point="1"><span class="mam-icon">&#128204;</span>Save this location</button>';
      const routeFromBtnHtml='<button class="mam-item" data-route-from="1"><span class="mam-icon">&#9873;</span>Route from here</button>';
      const snapshotBtn='<button class="mam-item" data-snapshot="1"><span class="mam-icon">&#128190;</span>Share a snapshot (with routes)</button>';
      const shown={};
      if(cats.some(c=>c.builtin)){
        // Menu order follows the category order set in the Creator; built-in items and
        // groups can each be hidden there too.
        cats.forEach(c=>{
          if(c.hidden) return;
          if(c.builtin==='share'){ html+=shareBtn; }
          else if(c.builtin==='save'){ html+=saveBtn; }
          else if(c.builtin==='routefrom'){ html+=routeFromBtnHtml; }
          else if(c.builtin==='snapshot'){ html+=snapshotBtn; }
          else if(c.name && groupMap[c.name] && groupMap[c.name].length){ html+=catBtnHtml(c.name,c); shown[c.name]=1; }
        });
        // Any groups without a matching category row appear at the end.
        groupOrder.forEach(g=>{ if(!shown[g] && !catMap[g] && groupMap[g] && groupMap[g].length){ html+=catBtnHtml(g,null); } });
      } else {
        // Fallback for exports made before categories carried the built-ins.
        html+=shareBtn+saveBtn+routeFromBtnHtml;
        groupOrder.forEach(g=>{ html+=catBtnHtml(g,catMap[g]); });
      }
      menuEl.innerHTML=html;
      const shareMapBtn=menuEl.querySelector('[data-share-map]');
      if(shareMapBtn) shareMapBtn.addEventListener('click',shareThisMap);
      const routeFromBtn=menuEl.querySelector('[data-route-from]');
      if(routeFromBtn) routeFromBtn.addEventListener('click',()=>{ const ll=currentLatLng; closeMenu(); startRouteFrom(ll); });
      const savePointBtn=menuEl.querySelector('[data-save-point]');
      if(savePointBtn) savePointBtn.addEventListener('click',saveLocationHere);
      const snapBtn=menuEl.querySelector('[data-snapshot]');
      if(snapBtn) snapBtn.addEventListener('click',shareSnapshot);
      menuEl.querySelectorAll('[data-group]').forEach(btn=>{
        btn.addEventListener('click',()=>renderActionLevel(btn.dataset.group));
      });
      clampMenuPosition();
    }

    function renderActionLevel(group){
      let html='<div class="mam-header"><button class="mam-back" title="Back">&#8592;</button>'+esc(group)+'</div>';
      (groupMap[group]||[]).forEach((a,i)=>{
        const chipStyle=' style="color:'+esc(a.iconColor||'#555555')+'"';
        const iconHtml=a.iconSvg?('<span class="mam-icon mam-icon-chip"'+chipStyle+'>'+a.iconSvg+'</span>')
          :a.iconImgSrc?('<span class="mam-icon mam-icon-chip"><img src="'+esc(a.iconImgSrc)+'" alt=""></span>')
          :'<span class="mam-icon">&#128205;</span>';
        html+='<button class="mam-item" data-idx="'+i+'">'+iconHtml+esc(a.name)+'</button>';
      });
      menuEl.innerHTML=html;
      menuEl.querySelector('.mam-back').addEventListener('click',renderGroupLevel);
      menuEl.querySelectorAll('[data-idx]').forEach(btn=>{
        btn.addEventListener('click',()=>openAction(groupMap[group][parseInt(btn.dataset.idx)]));
      });
      clampMenuPosition();
    }

    function openMenuAt(latlng, clientX, clientY){
      if(routeEditing) return;
      currentLatLng=latlng;
      lastClientX=clientX;
      lastClientY=clientY;
      menuEl.classList.add('open');
      showTempMarker(latlng);
      renderGroupLevel();
    }

    // Clicks inside the menu must never bubble to the document-level "close on
    // outside click" listener below — otherwise, since a click's own handler
    // above already replaces menuEl's contents (destroying the clicked button
    // node), menuEl.contains(e.target) would wrongly evaluate to false once
    // the event bubbles up, instantly closing the menu we just re-rendered.
    menuEl.addEventListener('click',e=>e.stopPropagation());

    // ---- Place search (Nominatim geocoding) ----
    (function(){
      var btn=document.getElementById('search-btn');
      if(!btn) return;
      var panel=document.getElementById('search-panel');
      var input=document.getElementById('search-input');
      var go=document.getElementById('search-go');
      var closeBtn=document.getElementById('search-close');
      var collapseBtn=document.getElementById('search-collapse');
      var results=document.getElementById('search-results');
      var statusEl=document.getElementById('search-status');
      var busy=false;
      var numMarkers=[], curList=[]; var searchLayer=L.layerGroup().addTo(map);
      function isTouchDevice(){ try{ return (navigator.maxTouchPoints||0)>0 || ("ontouchstart" in window); }catch(e){ return false; } }
      // Autofocus only on a real desktop: on touch devices it makes the browser zoom
      // into the field (also in Chrome's "Desktop site" mode, which reports pointer:fine).
      function isFinePointer(){ try{ return !isTouchDevice() && window.matchMedia && window.matchMedia("(pointer:fine)").matches; }catch(e){ return false; } }
      function openPanel(){ closePanelsExcept("search-panel"); panel.classList.remove("hidden"); searchActive=true; following=false; setResultsCollapsed(false); if(isFinePointer()) setTimeout(function(){ input.focus(); },40); }
      function closePanel(){ panel.classList.add("hidden"); } // collapse: keep markers + keep auto-centering paused
      function endSearch(){ clearMarkers(); results.innerHTML=""; statusEl.textContent=""; input.value=""; panel.classList.add("hidden"); searchActive=false; lastUserInteraction=Date.now(); }
      btn.addEventListener("click",function(e){ e.stopPropagation(); if(panel.classList.contains("hidden")) openPanel(); else closePanel(); });
      var resultsCollapsed=false;
      function setResultsCollapsed(on){ resultsCollapsed=on; panel.classList.toggle("results-collapsed",on); collapseBtn.classList.toggle("flip",on); collapseBtn.title=on?"Show results":"Hide results"; }
      collapseBtn.addEventListener("click",function(e){ e.stopPropagation(); setResultsCollapsed(!resultsCollapsed); });
      closeBtn.addEventListener("click",function(e){ e.stopPropagation(); endSearch(); });
      panel.addEventListener("click",function(e){ e.stopPropagation(); });
      map.on("moveend zoomend rotate", scheduleLabels);
      map.on("click", function(){ if(!panel.classList.contains("hidden") && !resultsCollapsed) setResultsCollapsed(true); });
      input.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); doSearch(); } });
      go.addEventListener("click",function(e){ e.stopPropagation(); doSearch(); });
      var catSel=document.getElementById("search-cat");
      var catList=(typeof SEARCH_CATS!=='undefined'?SEARCH_CATS:[]);
      if(catSel){
        var o0=document.createElement("option"); o0.value=""; o0.textContent="Looking for?"; catSel.appendChild(o0);
        catList.forEach(function(c,i){
          var o=document.createElement("option");
          o.value=String(i); o.textContent=(c.icon?c.icon+" ":"")+c.label;
          catSel.appendChild(o);
        });
        catSel.addEventListener("change",function(e){
          e.stopPropagation();
          var i=parseInt(catSel.value,10); catSel.value="";
          if(isNaN(i)||!catList[i]) return;
          input.value=catList[i].label;
          doSearchTerms(catList[i].terms, catList[i].label, true);
        });
      }
      function inExtentRef(){
        // Measure from your real GPS position when location is on — even if it lies outside
        // the current view (e.g. searching Groningen from Amersfoort). With "Location off"
        // there is no own position, so the centre of the map is the reference point.
        if(locMode!=='off' && lastKnownLatLng){ return {pt:L.latLng(lastKnownLatLng[0],lastKnownLatLng[1]), gps:true}; }
        return {pt:map.getCenter(), gps:false};
      }
      var NOM_LIMIT=40;          // Nominatim hard limit: it never returns more than 40
      function searchDebugOn(){ try{ return (location.search+location.hash).indexOf('debug')>=0 || !!window.PW_DEBUG; }catch(e){ return false; } }
      var dbg=[];
      var WIDE_KM=8;           // wider than this, a category search is only a sample
      function viewKm(){
        var b=map.getBounds(), c=b.getCenter();
        return Math.abs(b.getEast()-b.getWest())*111.32*Math.max(0.2,Math.cos(c.lat*Math.PI/180));
      }
      var NOM_GAP=1100;        // ms between Nominatim calls (their policy: max 1 req/s)
      var nomLast=0;
      function nomFetch(url){
        var wait=Math.max(0, NOM_GAP-(Date.now()-nomLast));
        return new Promise(function(res){ setTimeout(res,wait); }).then(function(){
          nomLast=Date.now();
          return fetch(url,{headers:{"Accept":"application/json"}});
        });
      }
      function nominatimUrlBox(q,b){
        var vb="&viewbox="+b.getWest()+","+b.getNorth()+","+b.getEast()+","+b.getSouth()+"&bounded=1";
        return "https://nominatim.openstreetmap.org/search?format=json&limit="+NOM_LIMIT+"&addressdetails=1&extratags=1&accept-language=nl,en"+vb+"&q="+encodeURIComponent(q);
      }
      function nominatimUrl(q){ return nominatimUrlBox(q, map.getBounds()); }
      function boxAround(latlng,meters){
        var dLat=meters/111320;
        var dLng=meters/(111320*Math.max(0.2,Math.cos(latlng.lat*Math.PI/180)));
        return L.latLngBounds([latlng.lat-dLat,latlng.lng-dLng],[latlng.lat+dLat,latlng.lng+dLng]);
      }
      function numberIcon(n,name,hi){
        var sz=hi?30:24;
        var label=name?('<span class="srn-label">'+esc(name)+'</span>'):"";
        return L.divIcon({className:"",html:'<div class="srn'+(hi?" srn-hi":"")+'">'+n+label+'</div>',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
      }
      var _measEl=null;
      function textW(t){ if(!_measEl){ _measEl=document.createElement("span"); _measEl.style.cssText="position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;font-size:12px;font-weight:600;padding:1px 6px"; document.body.appendChild(_measEl); } _measEl.textContent=t; return _measEl.offsetWidth; }
      function layoutLabels(){
        var placed=[], i, j;
        for(i=0;i<numMarkers.length;i++){
          var m=numMarkers[i]; if(!m) continue;
          var el=m.getElement(); if(!el) continue;
          var lbl=el.querySelector(".srn-label"); if(!lbl) continue;
          var cp=map.latLngToContainerPoint(m.getLatLng());
          var w=textW(nameOf(curList[i]))+2;
          var r={x:cp.x+17, y:cp.y-9, w:w, h:18};
          var ok=true;
          for(j=0;j<placed.length;j++){ var p=placed[j]; if(!(r.x>p.x+p.w||r.x+r.w<p.x||r.y>p.y+p.h||r.y+r.h<p.y)){ ok=false; break; } }
          if(ok){ for(j=0;j<numMarkers.length;j++){ if(j===i||!numMarkers[j]) continue; var q=map.latLngToContainerPoint(numMarkers[j].getLatLng()); if(q.x>r.x-6 && q.x<r.x+r.w+6 && q.y>r.y-6 && q.y<r.y+r.h+6){ ok=false; break; } } }
          if(ok){ placed.push(r); lbl.classList.add("on"); } else { lbl.classList.remove("on"); }
        }
      }
      var _lblRaf=null;
      function scheduleLabels(){ if(_lblRaf) return; _lblRaf=requestAnimationFrame(function(){ _lblRaf=null; layoutLabels(); }); }
      function nameOf(item){ var dn=item.display_name||""; return (item.name&&item.name.trim())?item.name.trim():((dn.split(",")[0])||dn).trim(); }
      function fmtDist(m){ return (m<1000)?(Math.round(m)+" m"):((m/1000).toFixed(1)+" km"); }
      function clearMarkers(){
        // Detach the marker refs FIRST, then close any open result popup, then
        // empty the layer. Order matters: removing a marker fires 'remove' ->
        // closePopup -> 'popupclose', whose handler re-icons numMarkers[k]. If
        // that runs mid-removal (while the marker's _map is still set), Leaflet
        // re-creates an icon element for a marker that's being deleted, leaving an
        // orphan that no longer re-projects on zoom (it drifts). Clearing
        // numMarkers up front makes that handler a no-op, so no orphan is created.
        numMarkers=[];
        if(map) map.closePopup();
        if(searchLayer) searchLayer.clearLayers();
        if(typeof closeMenu==="function") closeMenu();
      }
      function setHi(idx,on){
        var m=numMarkers[idx];
        if(m){ m.setIcon(numberIcon(idx+1,nameOf(curList[idx]),on)); m.setZIndexOffset(on?4000:(2000+(curList.length-idx))); }
        var rows=results.children; if(rows[idx]) rows[idx].classList.toggle("sr-hover",on);
        scheduleLabels();
      }
      function osmUrl(item,lat,lon){
        if(item && item.osm_type && item.osm_id){ return "https://www.openstreetmap.org/"+item.osm_type+"/"+item.osm_id; }
        return "https://www.openstreetmap.org/?mlat="+lat+"&mlon="+lon+"#map=18/"+lat+"/"+lon;
      }
      function siteUrl(item){
        var e=item.extratags||{}; var u=e.website||e.url||e["contact:website"]||e["contact:url"]||"";
        u=(""+u).trim(); if(!u) return "";
        var low=u.toLowerCase();
        if(low.indexOf("http://")!==0 && low.indexOf("https://")!==0){ while(u.charAt(0)==="/") u=u.substring(1); u="https://"+u; }
        return u;
      }
      function makePopupDiv(item,marker){
        var lat=parseFloat(item.lat), lon=parseFloat(item.lon), name=nameOf(item);
        var pdiv=document.createElement("div"); pdiv.className="sr-pop";
        var site=siteUrl(item);
        var globe='<svg viewBox="0 0 24 24" width="12" height="12" style="vertical-align:-1px" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 2.6 15.4 0 18M12 3c-2.6 2.6-2.6 15.4 0 18"/></svg>';
        var html=site?('<a class="sr-name-link" href="'+esc(site)+'" target="_blank" rel="noopener" title="Open website in new tab">'+esc(name)+' '+globe+'</a>'):('<b>'+esc(name)+'</b>');
        if(lastKnownLatLng){
          var d=L.latLng(lastKnownLatLng[0],lastKnownLatLng[1]).distanceTo([lat,lon]);
          html+='<div class="sr-pop-dist">'+esc(fmtDist(d))+' from you</div>';
        }
        var linkIcon='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';
        html+='<div class="sr-pop-actions"><button type="button" class="sr-route-btn">Route to / actions</button>'
            +'<a class="sr-osm-link" href="'+esc(osmUrl(item,lat,lon))+'" target="_blank" rel="noopener" title="Open on OpenStreetMap (tags / details)">'+linkIcon+'OSM</a></div>';
        pdiv.innerHTML=html;
        pdiv.querySelector(".sr-route-btn").addEventListener("click",function(ev){
          ev.stopPropagation();
          if(marker) marker.closePopup();
          openMenuAt(L.latLng(lat,lon), ev.clientX, ev.clientY);
        });
        var lnk=pdiv.querySelector(".sr-osm-link"); if(lnk) lnk.addEventListener("click",function(ev){ ev.stopPropagation(); });
        var nl=pdiv.querySelector(".sr-name-link"); if(nl) nl.addEventListener("click",function(ev){ ev.stopPropagation(); });
        return pdiv;
      }
      function makeResult(item,idx,rp){
        var el=document.createElement("div"); el.className="search-result";
        var name=nameOf(item);
        var dist=rp?fmtDist(rp.distanceTo([+item.lat,+item.lon])):"";
        el.innerHTML='<span class="sr-num">'+(idx+1)+'</span><span class="sr-name">'+esc(name)+'</span>'+(dist?'<span class="sr-dist">'+esc(dist)+'</span>':'');
        el.addEventListener("click",function(){ selectResult(idx); });
        el.addEventListener("mouseenter",function(){ setHi(idx,true); });
        el.addEventListener("mouseleave",function(){ setHi(idx,false); });
        return el;
      }
      function selectResult(idx){
        var item=curList[idx]; if(!item) return;
        var lat=parseFloat(item.lat), lon=parseFloat(item.lon); if(isNaN(lat)||isNaN(lon)) return;
        closePanel();
        map.panTo([lat,lon]);
        var m=numMarkers[idx]; if(m) m.openPopup();
      }
      function showResults(list){
        clearMarkers(); results.innerHTML="";
        var ref=inExtentRef();
        list=list.slice().sort(function(a,b){ return ref.pt.distanceTo([+a.lat,+a.lon])-ref.pt.distanceTo([+b.lat,+b.lon]); });
        curList=list;
        list.forEach(function(item,idx){
          results.appendChild(makeResult(item, idx, ref.pt));
          var lat=parseFloat(item.lat), lon=parseFloat(item.lon);
          if(isNaN(lat)||isNaN(lon)){ numMarkers.push(null); return; }
          var m=L.marker([lat,lon],{icon:numberIcon(idx+1,nameOf(item),false),zIndexOffset:2000+(list.length-idx)}).addTo(searchLayer);
          m.bindPopup(makePopupDiv(item,m),{closeButton:true});
          (function(k){ m.on("popupopen",function(){ setHi(k,true); }); m.on("popupclose",function(){ setHi(k,false); }); })(idx);
          numMarkers.push(m);
        });
        statusEl.textContent = ref.gps ? "In map area — nearest to you first" : "In map area — nearest to centre first";
        searchActive=true; following=false;
        layoutLabels();
      }
      var searchSeq=0;
      // Remember what was typed before, and offer it again when the field is tapped.
      var HIST_KEY='PeeWeeTrails_searchhist_'+location.pathname, hist=[];
      function loadHist(){ try{ hist=JSON.parse(localStorage.getItem(HIST_KEY)||'[]')||[]; }catch(e){ hist=[]; } fillHist(); }
      function fillHist(){
        var dl=document.getElementById('search-hist'); if(!dl) return;
        dl.innerHTML='';
        hist.forEach(function(h){ var o=document.createElement('option'); o.value=h; dl.appendChild(o); });
      }
      function rememberSearch(q){
        q=(q||'').trim(); if(!q) return;
        hist=hist.filter(function(h){ return h.toLowerCase()!==q.toLowerCase(); });
        hist.unshift(q);
        if(hist.length>8) hist=hist.slice(0,8);
        try{ localStorage.setItem(HIST_KEY, JSON.stringify(hist)); }catch(e){}
        fillHist();
      }
      loadHist();
      // The field shows the category label after picking one from the list. Pressing the
      // arrow (or Enter) must then repeat that CATEGORY search, not search for the label as
      // a name — that is why "Cafe Pub" used to come back as the one pub actually called
      // "Pub". Anything the user types themselves stays a normal (name/place) search.
      function catByLabel(q){
        var list=(typeof SEARCH_CATS!=='undefined'?SEARCH_CATS:[]);
        for(var i=0;i<list.length;i++){
          if((list[i].label||'').trim().toLowerCase()===q.toLowerCase()) return list[i];
        }
        return null;
      }
      function doSearch(){
        var q=(input.value||"").trim();
        if(!q){ input.focus(); return; }
        var cat=catByLabel(q);
        if(cat){ doSearchTerms(cat.terms, cat.label, true); return; }
        rememberSearch(q);
        doSearchTerms([q], null, false);
      }
      // Nominatim has no OR/AND: each term is searched on its own (one after another,
      // to stay friendly to the server) and the results are merged and de-duplicated.
      // One search per term, over the visible map. Nominatim never returns more than 40 and
      // ranks by importance, not by distance, so when 40 come back we simply say so: zoom in
      // and search again. Simple, fast and predictable beats a clever scheme that fires many
      // requests and still cannot guarantee completeness.
      function doSearchTerms(terms, label, isCategory){
        var myseq=++searchSeq;
        results.innerHTML=""; clearMarkers(); setResultsCollapsed(false);
        statusEl.classList.remove('sr-warn'); statusEl.classList.remove('sr-wide'); statusEl.textContent="Searching…";
        var all=[], seen={}, truncated=false, blocked=false, failed=false;
        dbg=[];
        function collect(list){
          if(list && list.length>=NOM_LIMIT) truncated=true;
          (list||[]).forEach(function(it){
            var key=(it.osm_type||'')+'/'+(it.osm_id||'')+'/'+it.lat+'/'+it.lon;
            if(seen[key]) return;
            seen[key]=1; all.push(it);
          });
        }
        function fetchQ(q){
          return nomFetch(nominatimUrlBox(q, map.getBounds()))
            .then(function(r){
              if(r.status===429 || r.status===503){ blocked=true; return null; }
              if(!r.ok){ failed=true; return null; }
              return r.json();
            })
            .then(function(list){
              if(list) collect(list);
              if(searchDebugOn()) dbg.push(q+':'+(list?list.length:(blocked?'429':'err')));
              return list;
            })
            .catch(function(){ failed=true; if(searchDebugOn()) dbg.push(q+':err'); return null; });
        }
        var chain=Promise.resolve();
        terms.forEach(function(t){
          chain=chain.then(function(){
            if(myseq!==searchSeq) return;
            // A category needs square brackets for an amenity-only search ([pub]). That is
            // documented for a single keyword; multi-word phrases such as "picnic site" may
            // not be understood that way, so if the bracketed search comes back empty, try
            // the plain phrase as well.
            if(!isCategory) return fetchQ(t);
            return fetchQ('['+t+']').then(function(list){
              if(myseq!==searchSeq) return;
              if(list && list.length) return;      // brackets worked
              if(blocked||failed) return;          // don't hammer a busy server
              // Only retry multi-word phrases without brackets: for a single keyword the
              // bracket form is the documented one, and a plain retry would just return
              // objects whose NAME contains the word (e.g. a pub actually called "Pub").
              if(t.indexOf(' ')<0) return;
              return fetchQ(t);
            });
          });
        });
        chain.then(function(){
          if(myseq!==searchSeq) return;
          if(!all.length){
            clearMarkers(); searchActive=false;
            statusEl.classList.remove('sr-warn');
            statusEl.textContent = blocked ? 'Search server is busy — try again in a moment.'
              : (failed ? 'Search failed — check your connection.'
              : 'No '+(label?label.toLowerCase():'results')+' in current map extent.');
            return;
          }
          showResults(all);
          // At 40 Nominatim cut the list (ranked by importance, not by distance), so even
          // something close by can be missing: say that instead of "nearest first".
          if(truncated){ statusEl.textContent='Max 40 reached. Zoom in to not miss results.'; statusEl.classList.add('sr-warn'); }
          else {
            statusEl.classList.remove('sr-warn');
            // Nominatim gives no guarantee that it returns everything in a large area: it
            // picks a selection by importance. Fewer than 40 results is therefore no proof
            // that the list is complete, so say so while the map view is wide.
            if(isCategory && viewKm()>WIDE_KM){
              statusEl.textContent='Map area is large — this is a selection, not all of them. Zoom in for a reliable list.';
              statusEl.classList.add('sr-wide');
            }
          }
          if(blocked||failed) statusEl.textContent+=' · some results may be missing (server busy)';
          if(searchDebugOn()) statusEl.textContent+='  [ '+dbg.join(' · ')+' → '+all.length+' unique ]';
        });
      }
    })();

    document.addEventListener('click',e=>{
      if(!menuEl.contains(e.target)) closeMenu();
    });
    // Safety net: a temp marker must never outlive its menu. If the menu is closed
    // but a temp marker somehow lingers (orphan), drop it on the next map interaction.
    map.on('moveend zoomend', function(){ if(menuEl && !menuEl.classList.contains('open')) removeTempMarker(); });

    // Desktop: right-click
    map.on('contextmenu',e=>{
      e.originalEvent.preventDefault();
      openMenuAt(e.latlng, e.originalEvent.clientX, e.originalEvent.clientY);
    });

    // Mobile/touch: long-press without significant finger movement
    let lpTimer=null, lpStart=null;
    const LP_MS=550, LP_TOL=12;
    mapEl.addEventListener('touchstart',e=>{
      if(e.touches.length!==1){ clearTimeout(lpTimer); lpStart=null; return; }
      const t=e.touches[0];
      lpStart=[t.clientX,t.clientY];
      clearTimeout(lpTimer);
      lpTimer=setTimeout(()=>{
        const latlng=map.mouseEventToLatLng(t);
        openMenuAt(latlng,t.clientX,t.clientY);
      },LP_MS);
    },{passive:true});
    mapEl.addEventListener('touchmove',e=>{
      if(!lpStart||e.touches.length!==1) return;
      const t=e.touches[0];
      const dx=t.clientX-lpStart[0], dy=t.clientY-lpStart[1];
      if(Math.sqrt(dx*dx+dy*dy)>LP_TOL){ clearTimeout(lpTimer); lpStart=null; }
    },{passive:true});
    mapEl.addEventListener('touchend',()=>{ clearTimeout(lpTimer); lpStart=null; });
    mapEl.addEventListener('touchcancel',()=>{ clearTimeout(lpTimer); lpStart=null; });
    // Prevent iOS' text-selection callout from popping up during a long-press on the map
    mapEl.style.webkitTouchCallout='none';

    renderAllSavedPoints();
    loadRoutesFromStorage();
  })();
})();
</script>
</body>
